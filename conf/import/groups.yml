###########################################################################
# 玩家组数据库
###########################################################################
#
# 玩家组设置
#
###########################################################################
# - Id                    组 ID。
#   Name                  组名称。
#   Level                 用于组排序的 GM 等级。（默认：0）
#   LogCommands           @命令是否记录日志。（默认：false）
#   Commands:             此组可使用的 @命令列表。（默认：无）
#     <atcommand name>    指定 @命令是否可被此组使用。
#   CharCommands:         此组可使用的 charcommand 列表。（默认：无）
#     <charcommand name>  指定 charcommand 是否可被此组使用。
#   Permissions:          此组拥有的权限列表。（默认：无）
#     <permission name>   此组是否拥有该权限。
#   Inherit:              要继承的组列表。（默认：无）
#     <group name>        是否继承该组。
###########################################################################

Header:
  Type: PLAYER_GROUP_DB
  Version: 1

Body:
  # 普通玩家允许自动拾取（追加到基础 groups.yml 的 Player 组）
  - Id: 0
    Commands:
      autoloot: true
      autolootitem: true
      autoloottype: true
