// Athena 角色服务器配置文件。

// 注意：注释是双斜杠 "//" 右侧的所有文本
// 注释中的任何文本都不会被服务器解析，仅作为
// 信息/参考使用。

// 服务器连线使用者账号与密码
userid: s1
passwd: p1

// 服务器名称，可以使用ASCII 160 作为空格字元
// 注意：服务器名称中不能带空格，否则工会图会无法出现!
// 建议：在名称的最后加入一个空格
server_name: rAthena

// 服务器显示名称：要在4至23位元组之间
wisp_server_name: Server

// 登录服务器 IP
// 角色服务器使用此 IP 连接登录服务器。
// 注意：当服务器位于防火墙后或使用
// 一台有多个网卡接口的机器。
//login_ip: 127.0.0.1

// 角色服务器监听此 IP 地址对应的网卡接口。
// 注意：这样可以在多个网卡接口上运行多个服务器
// 同时让每个服务器使用相同的端口。
//bind_ip: 127.0.0.1

// 登录服务器连接端口
login_port: 6900

// 角色服务器 IP
// 客户端连接时使用的 IP 地址。
// 设置为服务器的公网 IP。
//char_ip: 127.0.0.1

// 角色服务器连接端口
char_port: 6121

// 每条消息前打印的时间戳格式。
// 最多 20 个字符。
// 常用格式：
// %I:%M:%S %p（时:分:秒，12 小时制，AM/PM）
// %H:%M:%S（时:分:秒，24 小时制）
// %d/%b/%Y（日/月/年）
// 完整格式请参考 strftime() 手册。
//timestamp_format: [%d/%b %H:%M]

//重定向输出转义序列（颜色代码组）
stdout_with_ansisequence: no

// 服务器选择日志/文件夹中的消息类型
// 1: Log 警告消息
// 2: Log 错误和 SQL 错误消息.
// 4: Log 调试消息
// 例: "console_msg_log: 7" 记录全部3种
// 记录的消息由这个覆盖 console_silent 设置
console_msg_log: 0

// 存储以上设置的控制台信息途径
console_log_filepath: ./log/char-msg_log.log

//对console输出的信息进行过滤选项
//1: 隐藏普通信息
//2: 隐藏状态信息
//4: 隐藏注意信息
//8: 隐藏警告信息
//16: 隐藏错误及SQL错误信息
//32: 隐藏调试消息
//例子: "console_silent: 7"隐藏普通、状态和注意信息 (1+2+4)
console_silent: 0

// 控制台命令
// 准许 console 指令 开启/关闭
// 这个指令被叠加纪录在 log.file 内
console: off

// 服务器种类
// 没有什么特别的功能，只是在服务器名称后面加上说明
// 0=正常, 1=维护中, 2=18禁(18岁以上), 3=收费, 4=P2P(免费)
char_maintenance: 0

// 是否允许建立新角色
// 现在已确实支持 [Kevin]
char_new: yes

// 在服务器状态中显示新建角色
char_new_display: 0

// 连线到此服务器的最大使用者人数.
// 设置为 0 禁止用户登录。（-1 表示不限制）
max_connect_user: -1

// 突破最大人数限制的最小GM等级
// 角色服务器维护模式下仍可连接的组 ID（groupid >= allow）
// 默认：-1 = 无（不存在 ID < 0 的组）
// 参见：conf/groups.conf
gm_allow_group: 99

// 服务器多久储存所有文件时间间隔? (秒为单位)
// 在MAP配置文件中SQL版本的存储事件控制时间
autosave_time: 60

// 当存取 角色/工会/组队/宠物 信息的时候是否显示在命令提示列上
save_log: yes

// 游戏起始点的地图名称与坐标
// 格式：<地图名>,<x>,<y>{:<地图名>,<x>,<y>...}
// 最大起始点数量由 char.hpp 的 MAX_STARTPOINT 决定（默认 5）
// 在创建新人时可随机出生在以下5个地图.
// 注意：喵族需要 20151001 或更新的客户端。
start_point: iz_int,18,26:iz_int01,18,26:iz_int02,18,26:iz_int03,18,26:iz_int04,18,26
start_point_pre: new_1-1,53,111:new_2-1,53,111:new_3-1,53,111:new_4-1,53,111:new_5-1,53,111
start_point_doram: lasa_fild01,48,297

// 初心者一开始配发的物品
// 最大初始物品数量由 char.cpp 的 MAX_STARTITEM 决定（默认 32）
// 格式：<ID>,<数量>,<位置>{:<ID>,<数量>,<位置>...}
// 要自动装备物品，请填入装备位置；否则填 0。
// 注意：喵族需要 20151001 或更新的客户端。
start_items: 1201,1,2:2301,1,16:23484,1,0
start_items_pre: 1201,1,2:2301,1,16
start_items_doram: 1681,1,2:2301,1,16

// 初心者一开始配发的钱
start_zeny: 0

// 声望系统 名单上限
fame_list_alchemist: 10
fame_list_blacksmith: 10
fame_list_taekwon: 10

// 工会获得的经验值修改
// 调整税率在增加到工会之前. 例如,
// 假如设成 200, 工会将得到两倍玩家税率的经验值
guild_exp_rate: 100

// 未知的角色名称
unknown_char_name: Unknown

// 是否记录角色服务器日志?
log_char: yes

// 角色名的最小长度。
// 除非客户端使用了“移除 4/6 字符角色名限制”补丁，否则必须设为 '4'。
char_name_min_length: 4

// 允许名字中大小写
// 范例：Test-test-TEST-TesT; 设置: 0 不允许 (默认值), 1 允许
name_ignoring_case: no

// 角色名称符号位元组管理 位元组表(0x00-0x1f) 是非标准的.设置值总共有：
// 注意：适用于角色名、队伍名和公会名。
// 0: 没有限制(默认)
// 1: 只允许在 'char_name_letters'中设置的 字母/符号.
// 2: 禁止在'char_name_letters'设置的字母/符号，以外的全都允许
char_name_option: 1

// 设置您要使用“char_name_option”选项的字母/符号
// 注意: 不能使用空格，除非是添加“space”到列表中
char_name_letters: abcdefghijklmnopqrstuvwxyz ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890

// 依基本等级限制角色删除
// 0: 无限制 (玩家可以删除角色，不管角色等级多少)
// -X: 你不能删除基本等级 <= X 的角色
// Y: 你不能删除基本等级 >= Y 的角色
// e.g. char_del_level: 80 (玩家不能删除基本等级大于80的角色)
char_del_level: 0

// 角色删除需要的时间
// 默认: 86400 (24 小时)
// 注意: 需要客户端2010-08-03aragexeRE或更新版本
char_del_delay: 86400

// 限制角色删除时是否使用电子邮件或出生日期
// 限制角色删除字符类型
// 客户端默认输入电子邮件
// 1: 电子邮件
// 2: 出生日期
// 3: 电子邮件 或者 出生日期
// 重要！
// - 此配置仅对使用 0x0068 或 0x01fb 删除请求的客户端有效。
// - 较新客户端（2013+）请使用 langtype 1，以启用 0x01fb。
// - 不使用 0x0068 或 0x01fb 的客户端，默认只使用生日（YYMMDD）。
char_del_option: 2

// 限制角色删除时是否加入组队或公会
// 0: 没有任何限制
// 1: 如果加入一个组队, 角色将不被删除
// 2: 如果加入一个公会, 角色将不被删除
// 3: 如果加入一个组队或公会, 角色将不被删除(默认)
char_del_restriction: 3

// 限制某些职业的创建。（仅 20151001aRagexe 及以后有效）
// 0：不允许创建角色
// 1：只允许创建初学者（复兴前默认）
// 2：只允许创建召唤师
// 3：初学者和召唤师都可以创建（复兴后默认）
// 取消注释以自定义限制
//allowed_job_flag: 3

// 启动时是否清理 party_db 表中没有成员的队伍？
clear_parties: no

// 包含DB数据的文件夹
db_path: db

//===================================
// PIN代码系统
//===================================
// 注意：需要客户端2011-03-09aragexeRE或更高的版本
// 在选择人物时, 必须使用鼠标输入PIN代码
// 默认: yes
pincode_enabled: yes

// 允许用户多久改变自己的PIN代码
// 0: 从来没有 (默认)
// X: 每隔 X 天
pincode_changetime: 0

// 允许用户输入多少次错误的PIN代码
// 默认: 3 (客户端最多次数)
pincode_maxtry: 3

// 系统启动时, 玩家是否被迫使用PIN代码
// 默认: yes
pincode_force: yes

// 是否允许使用同样数字作为PIN代码?
// 默认: no
pincode_allow_repeated: no

// 是否允许使用不同数字作为PIN代码?
// 默认: no
pincode_allow_sequential: no

//===================================
// 插件系统
//===================================
// 角色字段置移动
// 注意：需要客户端2011-09-28aragexeRE或更高的版本
// 是否允许用户移动角色字段置之间的人物
// 默认: yes
char_move_enabled: yes

// 是否允许用户移动一个人物使用一个位置
// 如果启用了角色字段置移动
// 默认: yes
char_movetoused: yes

// 是否允许用户经常喜欢移动角色字段置
char_moves_unlimited: no

// 修改角色名
// 当角色加入到一个队伍中时, 是否允许修改角色名?
// 默认: no
char_rename_party: no

// 当角色加入到一个公会中时, 是否允许修改角色名?
// 默认: no
char_rename_guild: no

// 在服务器启动时, 是否检查SQL表的正确性?
char_checkdb: yes

// 当角色在一张不存在的地图登录时, 会被自动送回下面设置的默认地图和坐标.
default_map: prontera
default_map_x: 156
default_map_y: 191

// 多少天后应将不活动的氏族成员从其氏族中删除?
// 0: 永不删除
// X: 设置天数
// 默认: 14
clan_remove_inactive_days: 14

//===================================
// RODEX 邮箱
//===================================
// 多少天后将邮件退回给发件人?
// 0: 永不退回
// X: 设置天数
// 默认: 15
mail_return_days: 15

// 邮件退回给发件人后多少天可将其完全删除?
// 0: 永不删除
// X: 设置天数
// 默认: 15
mail_delete_days: 15

// '全部领取'按钮是否忽略未读邮件状态?
// no: 仅领取已读邮件中的附件
// yes: 领取所有邮件的附件
// 默认: yes
mail_retrieve: yes

// 没有附件的邮件是否退回给发件人?
// 默认: yes
mail_return_empty: yes

import: conf/import/char_conf.txt
