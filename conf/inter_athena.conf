// Web 服务器数据表
// 注意：Web 服务器会读取 login（login）和 char（party、guild）以及 map（party_bookings）的数据表，因此需要
//       连接这些数据库的权限。
guild_emblems: guild_emblems
user_configs: user_configs
char_configs: char_configs
merchant_configs: merchant_configs

// 地图服务器是否使用 SQL 版 item_db、mob_db、mob_skill_db？（yes/no）
// 请先生成所需的 SQL 文件并导入数据库。
use_sql_db: no

inter_server_conf: inter_server.yml

import: conf/import/inter_conf.txt
