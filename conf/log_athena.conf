//--------------------------------------------------------------
// rAthena 日志配置文件
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// 是否启用玩家交易记录日志? (Note 3)
// 0x00000000 - 不记录任何交易物品
// 0x00000001 - (T) 记录玩家之间交易的物品
// 0x00000002 - (V) 记录玩家出售的物品
// 0x00000004 - (P) 记录玩家丢弃/拾取的物品
// 0x00000008 - (L) 记录魔物掉落/抢劫的物品
// 0x00000010 - (S) 记录 NPC 交易的物品 (卖出/买入)
// 0x00000020 - (N) 记录脚本交易的物品 (通过任务删除/获得的物品)
// 0x00000040 - (D) 记录从魔物身上偷来的物品 (偷窃/抢劫)
// 0x00000080 - (C) 记录玩家使用的物品 (消耗品/宠物&生命体&商品 食物/用于技能&攻击的物品)
// 0x00000100 - (O) 记录制作/合成的物品
// 0x00000200 - (U) 记录 MVP 奖励的物品
// 0x00000400 - (A) 记录玩家创建/删除的物品 (通过 @/# commands 指令)
// 0x00000800 - (R) 记录通过仓库存取的物品
// 0x00001000 - (G) 记录通过公会仓库存取的物品
// 0x00002000 - (E) 记录通过邮箱系统交易的物品
// 0x00004000 - (I) 记录通过拍卖系统交易的物品
// 0x00008000 - (B) 记录通过购买商店交易的物品
// 0x00010000 - (X) 记录其他所有交易的物品 (租赁到期/使用卡片/通过 item_check 删除的物品/
//           因离婚而删除的戒指/宠物蛋孵化(还原)/宠物装备使用(还原)/武器精炼技能/清除陷阱技能)
// 0x00020000 - ($) 记录在线商城交易的物品
// 0x00040000 - (K) 记录账户银行交易的物品
// 0x00080000 - (F) 记录公会/组队被破坏时删除的物品
// 0x00100000 - (Y) 记录轮盘彩票交易的物品
// 0x00200000 - (Z) 记录合成项目中交易的物品
// 0x00400000 - (Q) 记录通过任务系统交易的物品
// 0x00800000 - (H) 记录私人飞艇系统消耗的物品
// 0x01000000 - (J) 记录易货商店交易
// 0x02000000 - (W) 记录合成改进系统交易
// 0x04000000 - (0) 记录装备评级系统交易
// 0x08000000 - (1) 记录装备改良系统交易
// 0x10000000 - (2) 记录装备附魔系统交易
// 例如: 记录玩家之间交易的物品+玩家出售的物品+脚本物品+创建物品: 1+2+32+1024 = 1059
// 请注意, 从背包到购物车的物品移动不会被记录.
enable_logs: 0xFFFFFFFF

// 是否使用MySQL记录日志么 (Note 1)
sql_logs: yes

// 日志过滤器
// =============================================================
// 任意条件为真时就会记录该物品
// 0 = 完全不记录
// 1 = 记录所有物品
// 按物品类型的高级过滤位：||
// 0002 - 恢复类物品（0）
// 0004 - 其他物品（3）+ 箭矢（10）
// 0008 - 可使用物品（2）+ 诱饵、卷轴（11）+ 商城可使用物品（18）
// 0016 - 武器（4）
// 0032 - 盾牌、防具、头饰、饰品等（5）
// 0064 - 卡片（6）
// 0128 - 宠物饰品（8）+ 宠物蛋（7）（怪物虽然不掉落，但所有日志都使用同一套规则）
// 0256 - 记录贵重物品（>= price_items_log）
// 0512 - 记录大量物品（>= amount_items_log）
// 1024 - 记录精炼物品（精炼值 >= refine_items_log）
// 2048 - 记录稀有物品（掉率 <= rare_items_log）

// 例如: (掉落记录设置)
// log_filter: 1    = 记录全部掉落物品
// log_filter: 2    = 仅记录治愈性物品
// log_filter: 4    = 仅记录其他物品和箭矢
// log_filter: 64   = 仅记录卡片
// log_filter: 322  = 记录卡片, 治愈性物品和那些价格 >= price_items_log参数内设置的值的物品
// log_filter: 4080 = 记录所有物品 (包括所有的稀有物品及总数) 除了治愈性物品、箭支和可用物品等等
log_filter: 1

// 如果物品的精练值 >= refine_items_log 的值，则记录此物品
refine_items_log: 5
// 如果物品的最小掉宝率 <= rare_items_log 的值，则记录此物品
// 1 = 0.01%, 100 = 1% 掉率, 等等
rare_items_log: 100
// 如果当前的物品价格< price_items_log 的值，则这个物品不被记录
price_items_log: 1000
// 如果物品的数量 < amount_items_log 的值，则这个物品不被记录
amount_items_log: 100
//=============================================================

// 枯树枝的使用记录
log_branch: no

// 记录 Zeny 金钱变化
// 过滤设置：
// 0 - 不记录; 1 - 记录任何Zeny的改变; 2到1000000 - 必须记录的最小Zeny值
log_zeny: 0

// 是否记录 Cash 点数变化 (Note 1)
log_cash: yes

// 记录 MVP 怪物掉落的道具
// 如果过时了可以用 Pick_Log 代替 但是这个日志可以用来保存被杀死的MVP怪物的记录
log_mvpdrop: no

// GM命令日志
// 记录gm命令使用日志(请先设置好记录命令的权限过滤条件) ('conf/groups.conf')
log_commands: yes

// 记录 NPC 的 'logmes' 指令
log_npc: yes

// 记录聊天内容 (全局, 密语, 组队, 工会, 主聊天)
// 记录的过滤
// =============================================================
// 0 = 不记录
// 1 - 记录全服消息
// 2 - 记录私聊消息
// 4 - 记录队伍消息
// 8 - 记录公会消息
// 16 - 记录主聊天频道消息
// 32 - 记录氏族消息
// 示例：
// log_chat: 5 = 同时记录私聊和队伍消息
// log_chat: 8 = 只记录公会消息
// log_chat: 63 = 记录全部
log_chat: 0

// 当 WoE 进行时是否禁用聊天记录? (Note 1)
log_chat_woe_disable: no

// 喂养日志
// 是否启用宠物或生命体喂养记录? (Note 3)
// 0: 关闭
// 1: 宠物
// 2: 生命体
log_feeding: 3

// 往日志文件中输出内容时, 在每行信息的前面加上时间格式.
// 最大长度不能超过20个字符.
// 常用的格式有:
// %I:%M:%S %p (小时:分钟:秒数 12小时制, 会携带AM或PM标记)
// %H:%M:%S (小时:分钟:秒数, 24小时制)
// %d/%b/%Y (日期/月份/年份)
// 更多的格式信息, 请参考C语言的strftime函数用法.
log_timestamp_format: %m/%d/%Y %H:%M:%S

// 日志文件/数据表
// 以下设置指定日志写到哪里。如果开启 'sql_logs'，
// 则使用 SQL 数据表，否则写入平面文件。

// log_gm_db: log/atcommandlog.log
// log_branch_db: log/branchlog.log
// log_chat_db: log/chatlog.log
// log_mvpdrop_db: log/mvplog.log
// log_npc_db: log/npclog.log
// log_pick_db: log/picklog.log
// log_zeny_db: log/zenylog.log
// log_cash_db: log/cashlog.log
// log_feeding_db: log/feedinglog.log

log_gm_db: atcommandlog
log_branch_db: branchlog
log_chat_db: chatlog
log_mvpdrop_db: mvplog
log_npc_db: npclog
log_pick_db: picklog
log_zeny_db: zenylog
log_cash_db: cashlog
log_feeding_db: feedinglog

import: conf/import/log_conf.txt
