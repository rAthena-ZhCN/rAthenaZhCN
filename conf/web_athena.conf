// rAthena Web 服务器配置文件。

// 注意：注释是双斜杠 "//" 右侧的所有文本
// 注释中的任何文本都不会被服务器解析，仅作为
// 信息/参考使用。

// Web 服务器监听此 IP 地址对应的网卡接口。
// 注意：这样可以在多个网卡接口上运行多个服务器
// 同时让每个服务器使用相同的端口。
//bind_ip: 127.0.0.1
 
// Web 服务器端口
web_port: 8888

// 每条消息前打印的时间戳格式。
// 最多 20 个字符。
// 常用格式：
// %I:%M:%S %p（时:分:秒，12 小时制，AM/PM）
// %H:%M:%S（时:分:秒，24 小时制）
// %d/%b/%Y（日/月/年）
// 完整格式请参考 strftime() 手册。
//timestamp_format: [%d/%b %H:%M]

// 重定向输出是否包含转义序列（颜色代码）
stdout_with_ansisequence: no

// 将指定类型的消息记录到 /log/ 目录下的文件
//1：记录警告消息
//2：记录错误和 SQL 错误消息。
//4：记录调试消息
//示例："console_msg_log: 7" 会记录全部 3 种
// 这里记录的消息会覆盖 console_silent 设置
console_msg_log: 0

// 保存上述控制台消息的文件路径
console_log_filepath: ./log/web-msg_log.log

// 通过省略某些类型的消息让服务器输出更安静：
//1：隐藏信息消息
//2：隐藏状态消息
//4：隐藏通知消息
//8：隐藏警告消息
//16：隐藏错误和 SQL 错误消息。
//32：隐藏调试消息
//示例："console_silent: 7" 会隐藏信息、状态和通知消息（1+2+4）
console_silent: 0

// 是否打印请求和响应？
// 便于调试，会打印每次交互的完整
// 请求和响应内容。
print_req_res: off

// 是否允许上传 GIF 作为公会徽章？
allow_gifs: yes

// 允许来自指定源的 HTTP 请求
// 为浏览器兼容性启用跨域资源共享（CORS）。
// 只接受来自已配置源的请求。
//   
// 格式：allowed_origin_cors: <协议>://<主机>:<端口>
// 示例：allowed_origin_cors: http://mywebsite.com:8080
//   
// 安全提示：只配置你信任的源，
// 因为这会允许跨域访问你的 Web API。
allowed_origin_cors:

import: conf/import/web_conf.txt
