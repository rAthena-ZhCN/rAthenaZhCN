//--------------------------------------------------------------
// rAthena 地图服务器配置文件
//--------------------------------------------------------------

// 注意：注释是双斜杠 "//" 右侧的所有文本
// 注释中的任何文本都不会被服务器解析，仅作为
// 信息/参考使用。

//--------------------------------------------------------------
//			设置信息
//--------------------------------------------------------------
// Interserver通信密码, 在 account.txt 中设置 ( 或 equiv.)
userid: s1
passwd: p1

// 角色服务器 IP
// 地图服务器使用此 IP 连接角色服务器。
// 注意：当服务器位于防火墙后或使用
// 一台有多个网卡接口的机器。
//char_ip: 127.0.0.1

// 地图服务器监听此 IP 地址对应的网卡接口。
// 注意：这样可以在多个网卡接口上运行多个服务器
// 同时让每个服务器使用相同的端口。
//bind_ip: 127.0.0.1

// 角色服务器的连接端口
char_port: 6121

// 地图服务器 IP
// 客户端连接时使用的 IP 地址。
// 设置为服务器的公网 IP。
//map_ip: 127.0.0.1

// 地图服务器的连接端口
map_port: 5121

// 每条消息前打印的时间戳格式。
// 最多 20 个字符。
// 常用格式：
// %I:%M:%S %p（时:分:秒，12 小时制，AM/PM）
// %H:%M:%S（时:分:秒，24 小时制）
// %d/%b/%Y（日/月/年）
// 完整格式请参考 strftime() 手册。
//timestamp_format: [%d/%b %H:%M]

// 重定向输出转义序列 (颜色代码组)
stdout_with_ansisequence: no

// 服务器选择日志/文件夹中的消息类型
// 1: Log 警告消息
// 2: Log 错误和 SQL 错误消息.
// 4: Log 调试消息
// 例: "console_msg_log: 7" 记录全部3种
// 记录的消息由这个覆盖 console_silent 设置
console_msg_log: 0

// 存储以上设置的控制台信息途径
console_log_filepath: ./log/map-msg_log.log

// 对console输出的信息进行过滤选项
// 1: 隐藏普通信息
// 2: 隐藏状态信息
// 4: 隐藏注意信息
// 8: 隐藏警告信息
// 16: 隐藏错误及SQL错误信息
// 32: 隐藏调试消息
// 例子: "console_silent: 7"隐藏普通、状态和注意信息 (1+2+4)
console_silent: 0

// 从哪个目录读取所有的数据文件?
db_path: db

// 是否允许 @guildspy 和 @partyspy 管理指令
// 注意:允许这两个指令将降低数据包的发送性能.
enable_spy: no

// 是否从游戏文件夹内读取.grf文件并取得地图数据?
// 设置为'yes'的话 , grf-files.txt 设置文件路径 , no为 mapcache读取.
use_grf: no

// 控制台指令
// 是否允许使用控制台指令 on/off
// 用法参考 log 配置文件
console: off

// 数据自动储存时间
// 所有脚色将会在这个区间完成储存， 单位为秒 (例如:
// 自动储存时间设置为60秒而线上共有60玩家 -> 每一秒将储存一个
// 脚色)
autosave_time: 300

// 最小数据储存区间 (毫秒)
// 限制角色存档频率，避免角色数量增加时
// char-server 的存读负载过高。
minsave_time: 100

// 跟autosave_time不同, 角色也将储存当牵涉
// 以下事件 (新增是必需的):
// 1: 每次成功交易之后
// 2: 露天商店每次交易后
// 4: 每次关闭仓库/工会仓库之后
// 8: 在 生成/回复 宠物
// 16: 寄出一封有挟带物的信件之后
// 32: 成功的拍卖物品之后
// 64: 删除/完成任务之后
// 128: 每次银行交易后 (存款/取款)
// 256: 每次签到奖励后
// 4095：始终保存
// 注意：这些设置可以降低服务器异常时出现复制/丢失物品的概率，
// 代价是增加地图/角色服务器的延迟。如果
// 服务器很少崩溃但服务器间延迟高，可以考虑关闭
// 这些选项。
save_settings: 4095

// 当玩家登陆的时候,将自动显示的当日信息
motd_txt: conf/motd.txt

// 当管理员使用 @help @help2 @h @charhelp指令时,输出的帮助文件名
charhelp_txt: conf/charhelp.txt

// 频道配置文件路径
channel_conf: conf/channels.conf

// 地图启用配置文件位置
import: conf/maps_athena.conf

import: conf/import/map_conf.txt
