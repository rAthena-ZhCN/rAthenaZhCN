//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// 是否使用旧版宠物捕捉率公式？（注 1）
// 旧版 Athena 公式：
//		( 基础率 + ( 玩家等级 - 怪物等级 ) * 30 + 玩家 luk * 20 ) * ( 200 - 当前怪物 HP 百分比 ) / 100
// 官方公式：（默认）
//		基础率 + ( 100 - 当前怪物 HP 百分比 ) * 基础率 / 100
pet_legacy_formula: no

// 捕捉宠物的概率（注 2）
pet_catch_rate: 100

// 玩家与要捕捉的怪物最多可以相距多少格？
// 尝试捕捉怪物时客户端会自动把玩家走进范围。
// 默认：5
// 设为 0 禁用检查
pet_distance_check: 5

// 官方服务器上玩家隐身时无法捕捉怪物。（注 1）
pet_hide_check: yes

// 宠物可以改名多次吗？（注 1）
pet_rename: no

// 喂食使宠物变得友好的概率。（注 2）
pet_friendly_rate: 100

// 宠物变得饥饿的概率。（注 2）
pet_hungry_delay_rate: 100

// 宠物使用技能前是否需要装备？（注 1）
// 这些加成是非官方的，见 import/pet_db.yml
pet_equip_required: yes

// 主人背包空间不足时是否销毁宠物装备？（注 1）
// 官方行为为 "yes"，设为 "no" 会保留装备。
pet_unequip_destroy: yes

// 主人攻击怪物时，宠物是否也攻击。（注 1）
pet_attack_support: no

// 主人受到怪物伤害时，宠物是否反击。（注 1）
pet_damage_support: no

// 宠物支援主人所需的最低亲密度。默认 900
// （亲密度范围 0 到 1000）。达到此最低值时，支援率为宠物正常值的 50%。
// 达到最大值（1000）时支援率为 150%。
pet_support_min_friendly: 900

// 宠物是否使用技能。（注 1）
// 注意：攻击型宠物技能需要至少 pet_attack_support 或
// pet_damage_support 才能生效（在宠物攻击时触发）。
pet_status_support: no

// 宠物在战斗中支援主人的概率。（注 2）
// 影响 pet_attack_support 和 pet_damage_support。
pet_support_rate: 100

// 宠物主人是否从宠物造成的伤害中获得经验？
pet_attack_exp_to_master: no

// 宠物攻击怪物获得经验的倍率
pet_attack_exp_rate: 100

// 宠物升级系统。使用 0 禁用（默认）。
// 启用后，宠物等级为主人等级的固定百分比。（注 2）
// 200% 时宠物等级翻倍，50% 时宠物等级为主人一半，等等。
pet_lv_rate: 0

// 启用宠物升级后，宠物的最大属性是多少？
pet_max_stats: 99

// 启用宠物升级后，以下是对
// 最小/最大伤害施加的上限。注意这些只限制 atk1 和 atk2，如果
// 启用 pet_str，它们的最大伤害为基础 atk + pet_max_atk2
pet_max_atk1: 500
pet_max_atk2: 1000

// 攻城战期间是否禁用宠物？
// 设为 yes 后，攻城战期间进入城堡时宠物会自动变回蛋，
// 且城堡内禁止孵化。
pet_disable_in_gvg: no

// petskillattack2 的固定伤害是否无视植物的无限防御？（注 1）
pet_ignore_infinite_def: yes

// 主人死亡时宠物是否继续攻击。（注 1）
pet_master_dead: no

// 即使客户端设置为 OFF 也发送自动喂食提示（注 1）
// 官方：yes
pet_autofeed_always: yes

// 宠物移动速度。
// 1：主人的移动速度（官方）
// 2：DEFAULT_WALK_SPEED 的值
// 3：怪物数据库的移动速度
pet_walk_speed: 1
