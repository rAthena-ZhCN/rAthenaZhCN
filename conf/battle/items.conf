//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// 通过商人“露天商店”技能出售物品的最高价格。（单位：zeny）
vending_max_value: 1000000000

// 当玩家的 zeny 加上物品总价超过允许的
// 最大 zeny 时，是否允许把物品放上露天商店。（注 1）
// 设为 "yes" 后物品会放上商店，但其他玩家无法购买。
// 官方行为为 "yes"，但某些官方服务器的客户端不允许这样做。
vending_over_max: yes

// 对所有露天商店交易征收的税（例如：10000 = 100%，50 = 0.50%）
// 征税时，买家支付物品全价，但
// 卖家不会拿到全部款项（只能得到 100% - 税率）。
vending_tax: 500

// 开始征税的最低交易总额。
// 官方设定低于 1 亿 zeny 不征税。
// 0 表示所有交易都征税。
vending_tax_min: 100000000

// 成功卖出物品时显示买家名字
buyer_name: yes

// 锻造成功率。（注 2）
weapon_produce_rate: 100

// 制作药水成功率。（注 2）
potion_produce_rate: 100

// 制作出的物品是否带有制作者名字？（注 3）
// 0x01：制作的武器
// 0x02：制作的药水
// 0x04：制作的箭矢
// 0x08：制作的圣水/圣礼
// 0x10：制作的致命药水
// 0x80：其他制作物品。
produce_item_name_input: 0x03

// 通过枯枝召唤的怪物是否主动？（注 1）
dead_branch_active: yes

// 召唤的怪物是否检查玩家基础等级？（枯枝）（注 1）
// 官方为 no——枯枝/血枝召唤的怪物可以是任意等级。
// 改为 'yes' 后只召唤等级小于等于玩家基础等级的怪物。
random_monster_checklv: no

// 换图时会检查未标记为 "available" 的物品，
// 并从背包/手推车/仓库中自动删除。
// 注意：未从 item_db 加载的物品视为不可用。
// 0x1：背包
// 0x2：手推车
// 0x4：仓库
item_check: 0x0

// 两次使用物品之间必须间隔多久？
// 只影响使用物品之间的延迟，防止恢复物品滥用。建议约 500 毫秒
// 官方为 0，但这里设为 100 毫秒以对抗机器人/宏。
item_use_interval: 100

// 两次使用商城食物之间必须间隔多久？默认：60000（1 分钟）
cashfood_use_interval: 60000

// 阻止状态变化所需的 bNoMagicDamage 等级（黄金盗虫卡片）。
// 例如设为 50。物品可以提供 bNoMagicDamage,40；
// 这会减少 40% 魔法伤害，但不会阻止状态变化。
gtb_sc_immunity: 50

// 是否允许自动施法卡片效果叠加？
// 注意：提供相同技能的不同卡片，无论设置如何，
// 都会各自独立生效。
autospell_stacking: no

// 是否允许消耗被 item_noequip.txt 禁用的可使用物品？（注 1）
// no = 无法消耗
// yes = 可以消耗但无效果
allow_consume_restricted_item: no

// 是否允许装备被 item_noequip.txt 禁用的物品？（注 1）
// no = 无法装备，进入地图时会被卸下
// yes = 可以装备但无效果
// 如果装备插有受限制的卡片，会忽略此检查但仍无效果。
allow_equip_restricted_item: yes

// 与 NPC 交互时是否允许更换装备？（注 1）
// 官方默认：复兴前 yes，复兴后 no
//item_enabled_npc: yes

// map_addflooritem 是否检查物品是否可掉落？（注 1）
// 设为 yes 时，玩家背包满时不可掉落物品会被销毁而不是掉在地上。
// 默认：yes
item_flooritem_check: yes

// 设置带 BindOnEquip 标志的物品装备后的默认绑定类型（见 db/[pre-]re/item_db.yml）
// 0 - 无
// 1 - 账号
// 2 - 公会
// 3 - 队伍
// 4 - 角色
default_bind_on_equip: 4

// 是否允许把绑定/限制出售物品卖给 Itemshop 作为货币？（注 3）
// 0x0 = 绑定/限制出售物品不能卖给 Itemshop/商店
// 0x1 = 绑定物品可以卖给 Itemshop
// 0x2 = 限制出售物品可以卖给 Itemshop
// 0x4 = 绑定物品可以卖给商店，
//       因为大多数限制交易物品仍然可以卖给商店
// 0x8 = 只有公会会长可以把 BOUND_GUILD 物品卖给商店或 Itemshop（如果设置了 0x1 或 0x4）
allow_bound_sell: 0x0

// 玩家获得带特殊广播标志的物品，或在带广播标志的等级精炼物品时，
// 是否用星号（*）隐藏玩家名字最后几个字符。
// 注意：如果此配置值设得较高，
// 名字较短的玩家可能会被完全替换为星号。
broadcast_hide_name: 2

// 是否允许把租赁物品卖给 NPC 商店？（注 1）
rental_transaction: yes

// 是否无视 item_db 中的物品价值，以 0 价格把租赁物品卖给 NPC 商店？（注 1）
rental_item_novalue: no

// 普通商店物品的最低购买价格
// 官方设定物品不能以低于 1 Zeny 的价格购买
min_shop_buy: 1

// 普通商店物品的最低出售价格
// 官方设定物品可以 0 Zeny 出售
min_shop_sell: 0

// 减少属性/种族伤害的物品是否应把所有怪物伤害都视为物理伤害？（注 1）
// 官方设定“Asprika”（神装）减少所有怪物伤害，而不只是物理伤害
// 而 Shaman Hat 完全不减少怪物伤害（在 PVP 中减少魔法伤害）
// 只影响带有 bonus3 bSubEle 和 bonus3 bSubRace 的物品。
cardfix_monster_physical: yes

// 决定交易时可堆叠物品是否单独计算背包空间，
// 即使对方玩家已经拥有该物品。
// （官方服务器为 yes）
trade_count_stackable: yes
