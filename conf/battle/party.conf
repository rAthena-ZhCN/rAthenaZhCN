//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
//--------------------------------------------------------------

// 有人偷窃（gank/steal 技能）时，是否在队伍中显示名字？（注 1）
show_steal_in_same_party: no

// 更新队伍成员小地图点的间隔（毫秒）
party_update_interval: 1000

// 更新队友 HP 条的方式：
// 0：Aegis - 每次 HP 变化都更新（带宽消耗大）
// 1：rAthena - 随队伍小地图点更新（最多 1 秒延迟）
party_hp_mode: 0

// 注意：
// 队伍内分享的等级范围在 conf/inter_athena.conf 的
// "party_share_level" 中设置。

// 队伍启用“队伍分享”物品分享时，
// 是否在队伍中公告哪个队员获得了什么物品？（注 1）
show_party_share_picker: yes

// 'show_party_share_picker' 启用时公告哪些类型的物品？
// 1：IT_HEALING，2：IT_UNKNOWN，4：IT_USABLE，8：IT_ETC，
// 16：IT_WEAPON，32：IT_ARMOR，64：IT_CARD，128：IT_PETEGG，
// 256：IT_PETARMOR，512：IT_UNKNOWN2，1024：IT_AMMO，2048：IT_DELAYCONSUME
// 262144：IT_CASH
show_picker.item_type: 112

// 队伍启用物品分享时的分配方式：
// 
// 0：普通（物品给随机队员）
// 1：非怪物掉落（玩家/宠物掉落）不分享
// 2：轮流（物品按顺序平均分配给队员）
// 3: 1+2
party_item_share_type: 0

// 队伍中挂机成员是否禁用经验/物品分享？
// 设为 no，或设置判定为挂机前需要经过的秒数（不是毫秒）
// 才能判定角色挂机。
// 在聊天室/露天商店中的角色始终视为挂机。
// 使用物品/使用技能/攻击（普攻也算）/移动都会重置角色的挂机状态。
idle_no_share: no

// 平均分配队伍中，每多一名队员（不含自己）是否给予额外经验加成？
// 例：设为 10 时，5 人平均分配队伍获得 +40% 经验（4 名队员 * 10%）：
//     队伍总经验 140%，每名队员获得 140%/5 = 28% 经验（而不是 20%）。
party_even_share_bonus: 0

// 无论玩家是否在公会中，都显示队伍名。
// 官方服务器即使玩家不在公会也显示队伍名。（注 1）
display_party_name: yes

// 是否阻止同一账号的多个角色加入同一队伍。（注 1）
block_account_in_same_party: yes

// 指定玩家不在同一地图时，是否阻止更换队长（注 1）
change_party_leader_samemap: yes
