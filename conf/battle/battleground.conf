//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// 战场地图的近战伤害调整（非技能）（注 2）
bg_short_attack_damage_rate: 80

// 战场地图的远程伤害调整（非技能）（注 2）
bg_long_attack_damage_rate: 80

// 战场地图的武器技能伤害调整（注 2）
bg_weapon_attack_damage_rate: 60

// 战场地图的魔法技能伤害调整（注 2）
bg_magic_attack_damage_rate: 60

// 战场地图的其他技能伤害调整（注 2）
bg_misc_attack_damage_rate: 60

// BG 场地的回避惩罚。
// 注意：这是百分比而非绝对值，20 表示总回避 -20%
bg_flee_penalty: 20

// 更新战场成员小地图点的间隔（毫秒）
bg_update_interval: 1000

// 玩家从战场队列传送进战场前，
// 检查玩家当前地图是否有 MF_NOWARP。
bgqueue_nowarp_mapflag: no
