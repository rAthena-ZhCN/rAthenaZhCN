//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
//--------------------------------------------------------------

// 创建公会时是否消耗 Emperium？（注 1）
guild_emperium_check: yes

// 公会成员的最高税率上限。
guild_exp_limit: 50

// 一个公会最多可拥有多少城堡（0 = 不限制）
guild_max_castles: 0

// 重新登录是否激活公会技能延迟？
// 0 - 保存冷却并在重登后继续。
// 1 - 不保存冷却，重登后重新计时。
// 官方默认：复兴前 1，复兴后 0
//guild_skill_relog_type: 0

// 应用于公会技能的延迟（毫秒）。
// 官方设置为 5 分钟（300000 毫秒）。
// 注意：复兴后已改为各技能独立冷却。
guild_skill_relog_delay: 300000

// 攻城战（公会战）的近战伤害调整（非技能）（注 2）
gvg_short_attack_damage_rate: 80

// 攻城战的远程伤害调整（非技能）（注 2）
gvg_long_attack_damage_rate: 80

// 攻城战的武器技能伤害调整（注 2）
gvg_weapon_attack_damage_rate: 60

// 攻城战的魔法技能伤害调整（注 2）
gvg_magic_attack_damage_rate: 60

// 攻城战的其他技能伤害调整（注 2）
gvg_misc_attack_damage_rate: 60

// GVG 场地的回避惩罚。官方值为 20（注 2）
// 注意：这是百分比而非绝对值，20 表示总回避 -20%
gvg_flee_penalty: 20

// “公会的荣耀”技能是否可以在公会窗口学习，
// 更换徽章是否需要它？（注 1）
// 附：该技能在官方服务器未实现
require_glory_guild: no

// 限制公会联盟数量。取值 0 到 3。
// 如果要修改此值，请清空公会联盟表。
// 默认 3
max_guild_alliance: 3

// 何时重新显示公会公告
// 传送时（无论是否换图）：2（官方）
// 换图时：1
// 不重新显示：0（禁用）
guild_notice_changemap: 2

// maprespawnguildid 是否也杀死克隆？
// 默认：no
guild_maprespawn_clones: no

// 更换公会会长后需要等待多少分钟？
// 默认：1440（1 天）
// 使用 0 分钟禁用延迟。
guild_leaderchange_delay: 1440

// 攻城战期间是否允许更换公会会长？
// 默认：no
guild_leaderchange_woe: no

// 是否只有公会会长可以接受联盟？
// 默认：no
guild_alliance_onlygm: no
