//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// 人工生命体设置（注 3）
// 启用各种“怪癖”，使它们的行为不同于普通角色。
// 0x01：不能被辅助技能指定为目标（主人除外）
// 0x04：在被攻击前，怪物会始终优先攻击它们而不是玩家
// 0x08：生成/换图时复制主人的移动速度
// 0x10：在属性窗口显示 luk/3+1 而不是实际暴击
//       （默认情况下它们不会暴击）
// 0x20：它们的最小魔攻始终等于最大魔攻
hom_setting: 0x3D

// 人工生命体蒸发时，其技能冷却或施法后延迟
// 是否重置？
// 官方默认：复兴前 yes，复兴后 no
//hom_delay_reset_vaporize: no

// 人工生命体蒸发时，其技能冷却或施法后延迟
// 传送或换图时？
// 官方默认：复兴前 yes，复兴后 no
//hom_delay_reset_warp: no

// 喂食使人工生命体变得友好的概率。（注 2）
homunculus_friendly_rate: 100

// 人工生命体可以改名多次吗？（注 1）
hom_rename: no

// 人工生命体进化所需的最低亲密度
homunculus_evo_intimacy_need: 91100

// 进化后重置亲密度为：
homunculus_evo_intimacy_reset: 1000

// 使用进化后的巴尼米乐“生物爆炸”所需的亲密度
hvan_explosion_intimate: 45000

// 人工生命体升级时是否向主人显示属性成长
homunculus_show_growth: yes

// 仅由人工生命体击杀怪物时，自动拾取是否生效？
homunculus_autoloot: no

// 主人死亡时人工生命体是否应蒸发？（注 2）
// 如果人工生命体 HP 低于 80%，则不会蒸发。
homunculus_auto_vapor: 80

// 普通人工生命体的最大等级
homunculus_max_level: 99

// 人工生命体 S 的最大等级
homunculus_S_max_level: 275

// 人工生命体 S 的成长等级
// 这是人工生命体 S 可以使用成长表的等级
// 如果没有此设置，洗点会导致所有等级的人工生命体 S 都使用
// 成长表，造成属性不平衡
homunculus_S_growth_level: 99

// 即使 OFF 也发送自动喂食提示（注 1）
// 官方：yes
homunculus_autofeed_always: yes

// 主人挂机时是否禁止人工生命体获得经验/物品？
// 设为 no，或设置判定为挂机前需要经过的秒数（不是毫秒）
// 才能判定角色挂机。
// 在聊天室/露天商店中的角色始终视为挂机。
// 使用物品/使用技能/攻击（普攻也算）/移动都会重置角色的挂机状态。
// 只有启用 'homunculus_autoloot' 时主人才会收到物品，
// 否则物品会像平常一样掉在地上。
// 注意：此选项使用独立的计时器跟踪挂机时间，与普通挂机计时器分开。
hom_idle_no_share: no

// 服务器如何判定人工生命体主人的挂机时间？（仅用于人工生命体经验分享和自动拾取）（注 3）
// （仅在启用 'hom_idle_no_share' 时生效）。
// 0x001 - 移动请求
// 0x002 - 对目标使用技能请求
// 0x004 - 对地面使用技能请求（范围技能）
// 0x008 - 使用物品请求（包括穿脱装备）
// 0x010 - 攻击请求
// 0x020 - 聊天请求（私聊、队伍、公会、战场等）
// 0x040 - 坐下/站起请求
// 0x080 - 表情请求
// 0x100 - 丢弃物品请求
// 0x200 - @/# 命令请求
// 请注意：至少要启用 1 个选项。
// 注意：启用的选项越多，这个功能越容易被绕过。
// 默认：移动（0x1）+ 对目标用技能（0x2）+ 对地面用技能（0x4）+ 使用物品（0x8）+ 攻击（0x10）= 0x1F
// 注意：这里可以为人工生命体单独配置，与普通挂机计时器和 'idletime_option' 分开。
// 仅对人工生命体单独击杀生效，不影响普通自动拾取和队伍分享选项。
idletime_hom_option: 0x1F

// 人工生命体从击杀中获得经验的倍率。（注 2）
// 仅适用于复兴模式。
// 官方：10%
homunculus_exp_gain: 10

// 人工生命体饥饿延迟发生变化时的饥饿率阈值（小于等于）。（注 2）
// 延迟值见 'homunculus_starving_delay'。
// 设为 0 禁用。
// 官方：10
homunculus_starving_rate: 10

// 人工生命体通常每 60 秒损失一次饥饿度，但达到 'homunculus_starving_rate' 后饥饿延迟降为 20 秒（毫秒）。
// 官方：20 秒
homunculus_starving_delay: 20000
