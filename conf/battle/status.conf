//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// 受到诅咒/眩晕/睡眠等（包括沉默）时是否取消技能施放（注 3）？
status_cast_cancel: 0

// 退出时是否移除某些技能状态变化？
// 0 =（默认）只移除带 SCF_NO_SAVE 标志的状态。
// 1 = 移除负面增益（标记为 debuff 的状态）
// 2 = 移除正面增益。
// 3 = 全部移除。
debuff_on_logout: 0

// 状态变化自然抵抗率的调整。
// 设为 50 时，状态防御减半，需要两倍属性才能
// 挡住它们（例如 200 vit 才能完全挡住眩晕）
pc_status_def_rate: 100
mob_status_def_rate: 100

// 状态变化的最大抵抗。（100 = 100%）
// 注意：卡片和装备可以超过此上限，因此只作用于自然抵抗。
pc_max_status_def: 100
mob_max_status_def: 100
