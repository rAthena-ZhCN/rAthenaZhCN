//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// PK 服务器模式。把整个服务器变成 PVP（城镇除外）。被其他玩家击杀时经验损失翻倍。
// 玩家击杀比自身高 20 级以上的怪物时，额外获得 15% 经验，并有 25% 概率获得更多物品。
// 此模式下有 nopvp.txt 用于设置不开启 PK 的地图。初学者不能被攻击也不能攻击。
// 普通 PVP 计数和排名显示也会被禁用。
// 注意：如果 pk_mode 设为 2 而不是 1（yes），玩家每次击杀
//   其他玩家会受到 5 点礼仪惩罚（见 manner_system
//   配置了解如何影响玩家）
pk_mode: 0

// 玩家进入 PK 区域时显示消息。
// 仅在 pk_mode 下生效（注 1）
pk_mode_mes: yes

// 礼仪/善恶系统配置。指定负礼仪
// （红色无聊天气泡）如何影响玩家（按需添加）：
//  0：无惩罚。
//  1：禁止聊天（包括私聊、队伍/公会消息等）
//  2：禁止使用技能
//  4：禁止使用命令
//  8：禁止使用/拾取/丢弃物品
// 16：禁止创建房间（聊天室和露天商店）
manner_system: 15

// 用于 PK 服务器模式。设置玩家可以开始 PK 的最低等级
pk_min_level: 55

// 用于 PK 服务器模式。指定玩家之间可以互相攻击的
// 最大等级差。0 表示不限制。
pk_level_range: 0

// 用于 PK 服务器。伤害调整设置，逻辑与
// 攻城战对应设置相同（见 guild.conf）
pk_short_attack_damage_rate: 80
pk_long_attack_damage_rate: 70
pk_weapon_attack_damage_rate: 60
pk_magic_attack_damage_rate: 60
pk_misc_attack_damage_rate: 60

// 是否在控制台显示技能使用？（仅调试用）（默认：off）（注 3）
skill_log: off

// 是否显示战斗日志？（仅调试用）（默认：off）（注 1）
battle_log: off

// 是否显示其他信息？（仅调试用）（默认：off）（注 1）
etc_log: off

// 是否调试传送点？设为 yes 后传送点会显示为旗帜。（注 1）
// 启动时还会运行传送点检查，打印出哪些传送点直接落在
// 触碰型 NPC 上（可能导致无限循环传送）
warp_point_debug: no

// 选择服务器是否从夜晚开始（yes）还是白天（no）
night_at_start: no

// 定义白天持续时间（毫秒）（默认：7200000 = 2 小时）
// 设为 0 禁用昼夜循环（但 @day GM 命令仍可用）。
// 除 0 外，最小值为 60000（1 分钟）
day_duration: 0

// 定义夜晚持续时间（毫秒）（默认：1800000 = 30 分钟）
// 设为 0 禁用夜晚循环（但 @night GM 命令仍可用）。
// 除 0 外，最小值为 60000（1 分钟）
night_duration: 0

// 是否允许在 PVP 地图决斗
duel_allow_pvp: no

// 是否允许在 GVG 地图决斗
duel_allow_gvg: no

// 决斗时是否允许使用传送/瞬移
duel_allow_teleport: no

// 死亡时自动退出决斗
duel_autoleave_when_die: yes

// 使用 @duel 的间隔（分钟）
duel_time_interval: 60

// 是否限制只能在同一地图决斗
duel_only_on_same_map: no

// 决定单个格子最多可重叠多少角色。
// 官方——只影响角色（包括怪物）的行走逻辑。
// 如果单位停止行走时所在格上的角色超过堆叠上限，
// 它会走向最近的空格。
// 设为 0 则不做堆叠检查，可自由移动。
// 自定义——此变体把每个满格都视为墙壁。
// 注意：要让自定义设置生效，服务器编译时
// 必须支持 Cell Stack Limit（见 src/map/map.hpp）
official_cell_stack_limit: 1
custom_cell_stack_limit: 1

// 是否只允许在带 autotrade 地图标记的地图挂店？
// 设为 "no" 允许在没有 "autotrade" 地图标记的地方挂店。
// 设为 "yes" 则只允许在带 "autotrade" 地图标记的地图挂店。
at_mapflag: no

// 设置挂店角色被踢下线的分钟数。
at_timeout: 0

// 挂店时玩家是否无法被攻击？（设置 state.monster_ignore）（注 1）
at_monsterignore: no

// 挂店是否触发 OnPCLogout 脚本事件？（注 1）
at_logout_event: yes

// 拍卖系统每小时费用。默认 12000
auction_feeperhour: 12000

// 拍卖最高售价
auction_maximumprice: 500000000

// 每次商店搜索查询之间的最小延迟（秒）。
searchstore_querydelay: 10

// 商店搜索查询在取消前允许返回的
// 最大结果数。
searchstore_maxresults: 30

// 是否显示现金点的获得和消耗（注 1）。
// 默认：no
cashshop_show_points: no

// 登录时是否显示邮箱状态。
// 默认：0
// 0 = No
// 1 = 是
// 2 = 是，有未读邮件时显示
mail_show_status: 0

// 用户每天可发送的邮件数量。
// 默认：100
// 0 = 不限制
mail_daily_count: 100

// 通过邮件转账 zeny 的手续费（注 2）
// 注意：此费率在客户端中是硬编码的，修改后需要相应修改客户端。
// 默认：2（2%）
// 0 = 免手续费
mail_zeny_fee: 2

// 每件附件物品需支付的 zeny
// 注意：此费用在客户端中是硬编码的，修改后需要相应修改客户端。
// 默认：2500
// 0 = 免手续费
mail_attachment_price: 2500

// 邮件可附带的物品总重量上限
// 注意：此上限在客户端中是硬编码的，修改后需要相应修改客户端。
// 默认：2000
// 0 = 不限制重量
mail_attachment_weight: 2000

// 攻城战期间是否禁止怪物变身？
// 设为 yes 后，攻城战期间进入城堡会自动移除/禁用怪物变身
mon_trans_disable_in_gvg: no

// 物品/点数商店的物品价格是否可打折？
// 0 = 否（默认）
// 1 = 物品商店
// 2 = 点数商店
// 3 = 物品和点数商店
discount_item_point_shop: 0

// 是否不显示“login-serv has been asked to %s the player '%.*s'.”消息（注 1）
disp_servervip_msg: no

// 允许用户重发新邮件的延迟（默认且最小为 1000）
mail_delay: 1000

// 是否禁止把玩家收藏标签页中的物品卖给 NPC。（注 1）
hide_fav_sell: no

// 在地图上搜索随机位置时，地图边缘多少范围不参与？
// 官方设定每边最外侧 15 格不作为目标格。
// 在某些地图（如金字塔）会导致外围区域怪物很少。这也会
// 影响传送。如果希望更接近旧版模拟器行为，请设为 1。
// 有效值：1-40
map_edge_size: 15

// 玩家丢弃物品时，物品能否堆叠在同一格？（注 1）
// 官方设定同一格可丢弃的物品数量没有限制。
// 设为 "no" 后，丢物品时只会丢在没有物品的格子上。
// 会向八个方向寻找空格。如果八次都找不到空格，
// 则丢弃失败（物品留在玩家背包中）。
item_stacking: yes
