//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
//--------------------------------------------------------------

// 物品掉落后是否直接进入玩家背包？（注 1）
item_auto_get: no

// 物品掉落后多久从地面消失？（毫秒）
flooritem_lifetime: 60000

// 第一个攻击者的拾取优先度加成（注 2）
// 怪物伤害记录中第一个仍存活且在同一地图的玩家会获得拾取优先度加成
// 官方设定：计算拾取优先度时，会把对怪物总伤害的 30% 加到该玩家的伤害上
// 设为 0 时，拾取优先度完全按造成的最高伤害计算
// 设为 100（最大）时，伤害记录中的第一个玩家始终拥有最高拾取优先度
// 拾取优先度决定玩家能多早拾取物品（见下方设置）
first_attack_loot_bonus: 30

// MVP 是否归属拥有拾取优先度的玩家？（注 1）
// 官方设定：MVP 归对 MVP 造成伤害与承受伤害之和最高的玩家。
// 如果希望 MVP 归第一个拾取优先度玩家（旧版 Athena 行为），请启用。
mvp_to_loot_priority: no

// 保护时间：只有对怪物造成伤害最高的玩家可以拾取物品（毫秒）
item_first_get_time: 3000

// 保护时间：只有伤害最高的前两名玩家可以拾取物品（毫秒）
// （在 item_first_get_time 结束后生效）
item_second_get_time: 2000

// 保护时间：只有伤害最高的前三名玩家可以拾取物品（毫秒）
// （在 item_second_get_time 结束后生效）
item_third_get_time: 2000

// 保护时间：只有对 Boss 造成伤害最高的玩家可以拾取物品（毫秒）
// 也适用于 MVP 奖励物品——当 MVP 无法获得奖励而掉落到地面时
mvp_item_first_get_time: 10000

// 保护时间：只有对 Boss 伤害最高的前两名玩家可以拾取物品（毫秒）
// 也适用于 MVP 奖励物品——当第一、第二 MVP 无法获得奖励而掉落到地面时
// （在 mvp_item_first_get_time 结束后生效）
mvp_item_second_get_time: 10000

// 保护时间：只有对 Boss 伤害最高的前三名玩家可以拾取物品（毫秒）
// 也适用于 MVP 奖励物品——当第一、第二、第三 MVP 无法获得奖励而掉落到地面时
// （在 mvp_item_second_get_time 结束后生效）
mvp_item_third_get_time: 2000

// 物品掉率（注 2）

// 普通物品的掉率（“其他”分类中的物品，卡片除外）
item_rate_common: 100
item_rate_common_boss: 100
item_rate_common_mvp: 100
item_drop_common_min: 1
item_drop_common_max: 10000

// 恢复类物品的掉率（恢复 HP 或 SP 的物品）
item_rate_heal: 100
item_rate_heal_boss: 100
item_rate_heal_mvp: 100
item_drop_heal_min: 1
item_drop_heal_max: 10000

// 可使用物品（物品分类中，恢复类除外）的掉率。
item_rate_use: 100
item_rate_use_boss: 100
item_rate_use_mvp: 100
item_drop_use_min: 1
item_drop_use_max: 10000

// 装备的掉率。
item_rate_equip: 100
item_rate_equip_boss: 100
item_rate_equip_mvp: 100
item_drop_equip_min: 1
item_drop_equip_max: 10000

// 卡片的掉率
item_rate_card: 100
item_rate_card_boss: 100
item_rate_card_mvp: 100
item_drop_card_min: 1
item_drop_card_max: 10000

// MVP 直接放入背包的奖励物品掉率调整
// 模式：0 - 官方顺序，1 - 随机顺序，2 - 全部物品
item_rate_mvp: 100
item_drop_mvp_min: 1
item_drop_mvp_max: 10000
item_drop_mvp_mode: 0

// 装备附加掉落物品的掉率调整。
item_rate_adddrop: 100
item_drop_add_min: 1
item_drop_add_max: 10000

// 装备附加掉落物品组内物品的掉率调整。
// 用于“矿石发现”以及盖亚之剑、宝石剑、烈焰卡片、天狗卡片、鬼角等物品。
item_group_rate: 100
item_group_drop_min: 1
item_group_drop_max: 10000

// 宝箱掉落的掉率调整（会覆盖其他所有修正）
item_rate_treasure: 100
item_drop_treasure_min: 1
item_drop_treasure_max: 10000

// 是否使用对数掉率？（注 1）
// 对数掉率会用以下公式进行非线性缩放
// Droprate(x,y) = x * (5 - log(x)) ^ (ln(y) / ln(5))
// 其中 x 是原始掉率，y 是 drop_rate 修正（即前面提到的 item_rate* 变量）
// 使用对数掉率时，可参考下表了解倍率对掉率的影响：
// Y：原始掉率
// X：掉率倍率修正（例如 item_rate_equip）
//  X\Y | 0.01 0.02  0.05  0.10  0.20  0.50  1.00  2.00  5.00 10.00 20.00
// -----+---------------------------------------------------------------
//   50 | 0.01 0.01  0.03  0.06  0.11  0.30  0.62  1.30  3.49  7.42 15.92
//  100 | 0.01 0.02  0.05  0.10  0.20  0.50  1.00  2.00  5.00 10.00 20.00
//  200 | 0.02 0.04  0.09  0.18  0.35  0.84  1.61  3.07  7.16 13.48 25.13
//  500 | 0.05 0.09  0.22  0.40  0.74  1.65  3.00  5.40 11.51 20.00 33.98
// 1000 | 0.10 0.18  0.40  0.73  1.30  2.76  4.82  8.28 16.47 26.96 42.69
// 2000 | 0.20 0.36  0.76  1.32  2.28  4.62  7.73 12.70 23.58 36.33 53.64
// 5000 | 0.50 0.86  1.73  2.91  4.81  9.11 14.45 22.34 37.90 53.91 72.53
//10000 | 1.00 1.67  3.25  5.28  8.44 15.24 23.19 34.26 54.57 72.67 91.13
//20000 | 2.00 3.26  6.09  9.59 14.83 25.49 37.21 52.55 77.70 97.95  100%
//50000 | 5.00 7.87 13.98 21.12 31.23 50.31 69.56 92.48  100%  100%  100%
item_logarithmic_drops: no

// 怪物掉率是否可能变为 0？（注 1）
// 默认：no（与官方服务器一致）。
drop_rate0item: no

// 是否把物品掉率增加 +0.01%？（注 1）
// 官方服务器可能出现 0.00% 掉率，因此所有物品掉率 +0.01%。
// 注意：rAthena 将其视为 bug。
// 默认：no
drop_rateincrease: no

// 让 LUK 以绝对值方式影响掉率。
// 设为 100 表示每点 luk 增加 0.01% 的掉落概率
// （与物品基础掉率无关）。
drops_by_luk: 0

// 让 LUK 以相对值方式影响掉率。
// 设为 100 表示每点 luk 增加 1% 的掉落概率
// （因此 100 luk 时，所有物品掉落概率翻倍）。
drops_by_luk2: 0

// 炼金术士召唤的海洋球和花是否掉落物品？
// 此设置有 3 个可选值：
// 0：不掉落任何物品。
// 1：只有海洋球掉落物品。
// 2：所有炼金术士召唤物都掉落物品。
alchemist_summon_reward: 1

// 是否广播 ** 玩家1 获得了 蛹的蛹卡（概率 0.01%）***
// 可设置为 0~10000 之间的任意值。
// 注意：使用“偷窃”技能偷到稀有物品时也会广播
// 0 = 完全不广播
// 1 = 广播 0.01% 掉率的物品
// 333 = 广播 3.33% 及以下掉率的物品
// 10000 = 广播所有物品
rare_drop_announce: 0

// 自动拾取是否考虑玩家的加成和惩罚？（注 1）
// 如果启用了 RENEWAL_DROP、泡泡糖或其他修正，自动拾取
// 会将其计算在内。
autoloot_adjust: 0

// 仅由佣兵击杀怪物时，自动拾取是否生效？
mercenary_autoloot: no

// 主人挂机时是否禁止从佣兵处获得物品？
// 设为 no，或设置判定为挂机前需要经过的秒数（不是毫秒）
// 才能判定角色挂机。
// 在聊天室/露天商店中的角色始终视为挂机。
// 使用物品/使用技能/攻击（普攻也算）/移动都会重置角色的挂机状态。
// 只有启用 'mercenary_autoloot' 时主人才会收到物品，
// 否则物品会像平常一样掉在地上。
// 注意：此选项使用独立的计时器跟踪挂机时间，与普通挂机计时器分开。
mer_idle_no_share: no

// 服务器如何判定佣兵主人的挂机时间？（注 3）
// （仅在启用 'mer_idle_no_share' 时生效）。
// 0x001 - 移动请求
// 0x002 - 对目标使用技能请求
// 0x004 - 对地面使用技能请求（范围技能）
// 0x008 - 使用物品请求（包括穿脱装备）
// 0x010 - 攻击请求
// 0x020 - 聊天请求（私聊、队伍、公会、战场等）
// 0x040 - 坐下/站起请求
// 0x080 - 表情请求
// 0x100 - 丢弃物品请求
// 0x200 - @/# 命令请求
// 请注意：至少要启用 1 个选项。
// 注意：启用的选项越多，这个功能越容易被绕过。
// 默认：移动（0x1）+ 对目标用技能（0x2）+ 对地面用技能（0x4）+ 使用物品（0x8）+ 攻击（0x10）= 0x1F
// 注意：这里可以为佣兵单独配置，与普通挂机计时器和 'idletime_option' 分开。
// 仅对佣兵单独击杀生效，不影响普通自动拾取和队伍分享选项。
idletime_mer_option: 0x1F

// 如果掉率低于此值，加成后的掉率也不能超过此值。
drop_rate_cap: 9000
drop_rate_cap_vip: 9000

// 怪物掉落带随机属性的物品时显示彩色光柱。
rndopt_drop_pillar: on

// 掉率加成是否作用于地图掉落？（注 1）
// 默认：yes
enable_bonus_map_drops: yes
