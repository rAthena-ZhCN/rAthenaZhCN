//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
//--------------------------------------------------------------

// 用于识别命令的符号。
// 可以设置任意单个字符，但不能是：
// - 控制字符（0x00-0x1f），
// - '%'（队伍聊天符号）
// - '$'（公会聊天符号）
// - '/'（客户端命令符号）
// atcommand_symbol 表示本地使用的 @命令。
// charcommand_symbol 表示对其他玩家使用的 #命令。
atcommand_symbol: @
charcommand_symbol: #

// 每条 GM 命令最多可召唤的怪物数量（0 表示不限制）
atcommand_spawn_quantity_limit: 100

// 使用 @slaveclone 命令最多可拥有的从属克隆数量（0 表示不限制）
atcommand_slave_clone_limit: 25

// 设为 'no' 时命令需要完整玩家名。设为 'yes' 时，输入部分
// 名字即可，只要当前地图服务器上所有玩家中
// 只有一个匹配。
// 一些关键 @命令（如监禁、封禁等）仍需要输入完整名字。
// 启用此设置后，charcommands 始终有效。
partial_name_scan: yes

// 是否封禁尝试交易复制的人。
// 封禁时长（分钟）（默认：5）。设为 0 禁用封禁。
ban_hack_trade: 5

// 需要启用 RENEWAL_EXP 或 RENEWAL_DROP（src/config/renewal.hpp）
// 修改 @mobinfo，按 renewal_drop 公式显示用户的真实掉率
// 修改 @iteminfo，不显示最低物品掉率（因为无法得知怪物等级）
// 修改 @whodrops，按 renewal_drop 公式显示用户的真实掉率
atcommand_mobinfo_type: 1

// @命令是否触发 NPC 的升级事件？（注 1）
// 此选项用于 @baselevelup 和 @joblevelup
// 默认：no
atcommand_levelup_events: no

// 玩家附着在 NPC 上时是否禁用 @命令？（注 1）
// 可以通过脚本命令 'enable_command' 和 'disable_command' 修改。
// 任何在 'conf/group.conf' 中拥有 'command_enable' 权限的人可以绕过。
// 默认：yes
atcommand_disable_npc: yes
