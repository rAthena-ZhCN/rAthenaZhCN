//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// MVP 的 HP 倍率。（注 2）
mvp_hp_rate: 100

// 普通怪物（非 MVP）的 HP 倍率。（注 2）
monster_hp_rate: 100

// 定义各种怪物 AI 相关设置。（注 3）
// 0x0001：启用后，怪物每移动 x 格更新一次目标格。
//         （通常它们直到走到路径终点前一格
//         才会更新目标格。x = monster_chase_refresh，见下文）
// 0x0002：如果怪物被攻击且无论以何种方式都无法反击
//         （例如：音速投掷），则使用“粗暴攻击”技能（通常是传送走），
//         否则只有在无法近身攻击到目标时
//         （例如：远程狙击）才会触发“粗暴攻击”。
// 0x0004：未设置时，可切换目标的怪物只在 [攻击范围+1] 内被攻击时才切换目标，
//         否则怪物可能切换目标去追击远程攻击者。
//         此标志也会覆盖 'provoke' 的目标。
// 0x0008：设置后，怪物一旦失去目标就会散开。使用此模式
//         可以大幅增加“隐身聚怪”的难度
//         （例如：音速投掷刷怪）。
// 0x0010：设置后，为友方定义的怪物技能也会对自己触发。
// 0x0020：设置后，地图上只要有玩家，该地图所有怪物
//         都会执行 AI，而不仅仅是玩家附近的怪物。
// 0x0040：设置后，当怪物目标换图或离开视野时，怪物
//         会朝视野内的 NPC 传送点/祭司传送点移动。
//         它只会走向自己能使用、且能把目标带回
//         视野内的传送点（配合下方 mob_warp 使用）。
// 0x0080：未设置时，处于攻击状态的怪物只会在被普通攻击
//         命中时切换目标。如果希望被技能命中时也切换目标，
//         请设置此项。
// 0x0100：设置后，怪物会从技能列表中随机选择一个技能开始，
//         而不是按顺序检查技能（未设置时，如果怪物技能太多，
//         靠后的技能很少会被选中）。
// 0x0200：设置后，怪物的技能冷却不会作用于同一技能的
//         所有条目，而只作用于实际使用的那个条目
//         （例如：怪物在 mob_skill_db 的六行里都有治愈术，
//         只有实际使用的那一行会进入冷却）。这会让怪物更难打，尤其是 MVP。
// 0x0400：设置后，怪物的所有技能射程都按 9 计算。否则
//         会遵守正常的技能射程规则。
// 0x0800：设置后，被挑衅的怪物会始终把目标切换到
//         挑衅者，即使它们通常不会因攻击而切换目标。
// 0x1000：设置后，当怪物选中技能但范围内没有有效目标
//         而无法使用时，会寻找其他可用技能。
//         例如“伟大的将军”会在 8-9 距离使用“地刺”，
//         而官方设定是先用“盲目攻击”后再在 0-7
//         距离使用。
// 0x2000：设置后，怪物在攻击或使用技能后会立即移动。
//         通常怪物在攻击动作期间 AI 是不活动的。
// 示例：0x140 -> 穿过传送点追击玩家 + 随机顺序使用技能。
monster_ai: 0

// 怪物应多久重新考虑一次追击？
// 0：每 100 毫秒（MIN_MOBTHINKTIME）
// 1：每移动一格
// x：每移动 x 格或追击路径终点前一格
// 32（最大）：追击路径终点前一格（官方）
// 无论此设置如何，怪物始终会检查攻击范围内的目标。
// 如果希望怪物在追击时反应更灵敏，可以降低此值。
// 如果希望怪物在追击时更新目标格，还需要启用
// monster_ai 0x0001，见上文。否则此值只定义怪物
// 失去目标后（隐身、无视线等）最多移动多少格。
monster_chase_refresh: 32

// 怪物是否可以被传送（按需添加）？
// 0：禁用。
// 1：站在 NPC 传送点上时启用怪物传送
// 2：站在祭司传送门上时启用怪物传送
// 4：目标地图是 'nobranch' 地图时禁用传送。
// 8：站在次元之门上时启用怪物传送
mob_warp: 0

// 定义所有玩家离开怪物附近后，怪物 AI 仍保持
// 活动状态的时间（毫秒）。
// 即使超过此时间，它们仍会随机行走并使用待机技能，
// 直到看到它们的玩家全部退出，或被传送、召回
// 或以其他方式从地图移除。
mob_active_time: 0
boss_active_time: 0

// 怪物和宠物的视野范围调整（mob_db 的 range2 列）（注 2）
view_range_rate: 100

// 追击范围是怪物放弃追击前的基础最小距离
// （只要目标在其视野外）。这是 mob_db 的 range3
// 列。（注 2）
chase_range_rate: 100

// 怪物应学会几级“苍鹰之眼”和“蛇之眼”？
// 官方怪物不会这些技能，所以它们的远程技能
// 射程只有 9。如果填入大于 0 的数字，射程会
// 增加该数值。
monster_eye_range_bonus: 0

// 拾荒怪物搜索物品的范围（最大 32）
// 官方：12
// 旧版 Athena：10
loot_range: 12

// 协助型怪物搜索可协助盟友的范围（最大 32）
// 官方：11
// 旧版 Athena：10
assist_range: 11

// 是否允许怪物主动攻击？（注 1）
monster_active_enable: yes

// mob_db 中的名字是否覆盖刷怪文件里指定的名字？
// 0: No
// 1：始终使用 mob_db 的 Name 列（英文怪物名）
// 2：始终使用 mob_db 的 JName 列（韩服原始怪物名）
override_mob_names: 0

// 怪物伤害延迟倍率（注 2）
// 影响发送给客户端的伤害延迟，也是移动延迟的基础值。
monster_damage_delay_rate: 100

// 拾荒怪物的行为。
// 0 = 怪物会消耗该物品。
// 1 = 怪物不会消耗该物品。
monster_loot_type: 0

// 怪物如何搜索地面物品？
// 0：最近的（旧版 Athena 风格）
// 1：范围内最旧的（官方）
monster_loot_search_type: 1

// 怪物施放技能的概率（注 2）
// 概率越高，怪物越可能只放技能而很少普通攻击。
// 设为 0 则禁用怪物技能。
mob_skill_rate: 100

// 怪物技能延迟调整（注 2）
// 怪物施放技能后，需要等待一段时间才能
// 再次施放。注意延迟为 0 的技能不受此设置
// 影响。
mob_skill_delay: 100

// 地图上怪物的倍率，200 表示数量为正常的 2 倍。（注 2）
mob_count_rate: 100

// 地图怪物的重生倍率。50 会让怪物重生速度加倍（延迟减半）（注 2）
//注意：不影响立即重生的怪物（大多数普通怪物）
mob_spawn_delay: 100
plant_spawn_delay: 100
boss_spawn_delay: 100

// 怪物重生时间是否应用随机浮动？（注 3）
// 官方服务器中由 boss_monster 命令生成的怪物（主要是 MVP）有浮动，旧版 Athena 是所有怪物都有浮动。
// 0：无
// 1：Boss 怪物（官方）
// 2：普通怪物
// 3：所有怪物（旧版 Athena）
mob_spawn_variance: 1

// 怪物是否不应在玩家视野内生成？
// 0 为禁用，否则为放弃前的重试次数，
// 超过后仍会在玩家视野内生成；除非使用最大值（100），
// 此时怪物不会生成，并在
// 5 秒后重试。
// 注意：对始终在同一格生成的怪物（如蚁蛋）
// 无效，除非设为最大值。
no_spawn_on_player: 0

// 是否忽略刷怪文件中的生成坐标？（注 1）
// 设为 yes 时，所有怪物都会在地图全范围内随机重生，
// 无视刷怪文件的设置。
force_random_spawn: no

// 每个怪物的中心格是否随机化？（注 1）
// 官方设定：服务器启动时，每个怪物的中心格会设为生成区域内的随机格。
// 每次重生时，怪物会在其中心格周围生成，而不是
// 生成定义中的原始中心。这会使总生成区域大得多，
// 并且每次服务器启动时的体验都不同。
// 如果希望某个刷怪点的所有怪物都在原始中心周围生成，
// 请设为 "no"，这样总生成区域会小得多（旧版 eAthena 行为）。
randomize_center_cell: yes

// 召唤的从属怪物是否继承主人的被动/主动特性？
// 0：不继承，保持原模式。
// 1：从属怪物始终主动。
// 2：从属怪物始终被动。
// 3：与主人的主动/被动状态相同。
// 4：模式被覆盖为从属模式（官方）
slaves_inherit_mode: 4

// 召唤的从属怪物是否与主人移动速度相同？
// 不适用于炼金术士召唤的海洋球
// 注意：官方服务器默认为 3。
// 0：从不。
// 1：如果主人可以移动
// 2：如果主人不能移动（即使静止怪物在 mob_db 中
//    也有速度值）
// 3：始终
slaves_inherit_speed: 3

// MVP 的从属怪物被召回主人身边时是否保留目标？（注 1）
mob_slave_keep_target: yes

// 从属怪物追击过远时是否传送回主人身边？（注 1）
// 官方设定可以将它们带到离主人任意远的地方。
slave_stick_with_master: no

// 主人活动时从属怪物是否始终保持活动？（注 1）
// 官方设定中可能存在主人活动但从属不活动的情况。
slave_active_with_master: no

// 召唤怪物（炼金术士或 @summon）攻击时，是否
// 有概率触发主人的自动施法卡片？（注 1）
summons_trigger_autospells: yes

// 怪物被另一个怪物攻击时，是否转而攻击那个怪物的主人？
// 注意：召唤怪物包括通过 @summon 和炼金术士召唤的怪物
retaliate_to_master: yes

// 技能触发反击怪物技能时，怪物是否临时切换目标（注 1）
// 例如：怪物攻击玩家 B，玩家 A 施放技能 C。若设为 yes 且
// 怪物有由技能 C 触发的技能，则 A 会成为该技能的
// 目标，否则 B 会成为反击技能的目标。
mob_changetarget_byskill: no

// 怪物职业变化时是否完全恢复 HP？（注 1）
monster_class_change_full_recover: yes

// 是否在怪物名字旁显示信息？（按需添加）
// （对守护者或 Emperium 无效）
// 1：显示怪物 HP（Hp/MaxHp 格式）
// 2：显示怪物 HP（满血百分比格式）
// 4：显示怪物等级
show_mob_info: 0

// 来自怪物的 zeny
zeny_from_mobs: no

// 怪物升级（每次击杀玩家后怪物会升级并变强）
// 经验计算方式：((怪物等级-原始等级)*(exp*(mobs_level_up_exp 倍率/100)))
// 注意：不适用于攻城战守护者。
mobs_level_up: no
mobs_level_up_exp_rate: 1

// 动态怪物选项
// 是否使用动态怪物？（推荐中小型服务器）
dynamic_mobs: yes

// 即使怪物受伤也移除
mob_remove_damaged: yes

// 空地图移除怪物前的延迟（默认 5 分钟 = 300 秒）
mob_remove_delay: 300000

// 定义怪物被击杀时 mob npc_event 在谁身上执行。
// 类型 1：在击杀怪物的玩家身上（若被非玩家击杀，则退回类型 0）
// 类型 0：在对怪物造成伤害最高的玩家身上。
// 注意：这会影响 Emperium 被破坏时城堡归谁。
mob_npc_event_type: 1

// 激活“防抢怪”保护的时间（毫秒）
// 设为 0 则禁用。
// 如果启用且玩家使用了 @noks，非队伍中其他玩家（抢怪者）的伤害
// 会被降为 0。
ksprotection: 0

// 是否生成 MVP 墓碑。
// 见 http://irowiki.org/wiki/MVP#Gravestone
mvp_tomb_enabled: yes

// MVP 墓碑生成前的延迟。
// 默认：9 秒
mvp_tomb_delay: 9000

// 特殊召唤怪物的体型是否影响经验、掉率
// 和属性。大体型怪物倍率翻倍，小体型减半。
// 仅在 'monster' 命令、@monsterbig 和 @monstersmall 下生效。（注 1）
// 默认：no
mob_size_influence: no

// 直接施放在怪物身上的冰墙应如何困住怪物？
// 官方服务器中，怪物只能从冰墙的西侧和南侧离开。如果目标在北侧或东侧，
// 它们会不断尝试追击但失败。这会形成循环，期间它们会使用
// 待机和追击技能。Boss 怪物则会表现得像被困住一样不移动，并使用
// 待机和被粗暴攻击时的技能（被攻击时）。
// 0：怪物完全不会被冰墙困住。
// 1：怪物表现得像被困住。
// 2-255：怪物在摆脱冰墙前经历上述行为的循环次数。
// 注意：某些服务器中普通怪物会在 15-35 秒后根据速度自行脱困。其他
// 服务器中它们会一直被冰墙困住直到冰墙消失。此外许多官方服务器（如 iRO）
// 在有 Boss 怪物的地图上完全禁止施放冰墙。
// 默认（最不易被利用）：普通怪物 - 75，Boss - 0
// 默认（最接近官方）：普通怪物 - 220，Boss - 1
mob_icewall_walk_block: 75
boss_icewall_walk_block: 0

// 是否显示怪物血条？
// 需要 2012-04-04aRagexeRE 或更新客户端。
monster_hp_bars_info: yes

// 怪物长时间无法移动时是否重生并向地图服务器输出警告？
// 这可能是正常玩法（例如玩家把 MVP 困在冰墙里），但如果想防止
// 任何利用并收到通知，可以设为 yes。
monster_stuck_warning: no

// 附近没有玩家时怪物使用待机技能的概率（注 2）
// 官方服务器中，怪物只要被看到过一次，即使附近没有玩家也会使用待机技能。
// 在中小型服务器上，这会导致所有蛋、罗达蛙/蛹等怪物变身。
// 要关闭，请设为 0。
mob_nopc_idleskill_rate: 100
boss_nopc_idleskill_rate: 100

// 附近没有玩家时怪物移动的概率（注 2）
// 官方服务器中，怪物只要被看到过一次，即使附近没有玩家也会一直移动。
// 要关闭，请设为 0。
mob_nopc_move_rate: 100
boss_nopc_move_rate: 100

// 击杀怪物时，同区域同队伍的所有人是否都触发 AG_BATTLE 类成就？
// 区域受 battle 配置的 area_size 限制。
achievement_mob_share: no

// 怪物重生的绝对最短时间（毫秒）。
// 也用于公会未加载时延迟生成守护者。
// 默认（官方）：1000
mob_respawn_time: 1000

// 定义怪物被困住后多久（毫秒）解除目标锁定。
// 在此期间怪物仍处于待机模式并对随机目标使用待机技能，
// 但不再被困住后会继续追击原目标。
mob_unlock_time: 2000
