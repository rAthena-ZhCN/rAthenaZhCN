//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵）
//--------------------------------------------------------------

// 施法所需时间的倍率（注 2，0 = 无吟唱时间）
casting_rate: 100

// 施法后的延迟时间（注 2）
delay_rate: 100

// 延迟是否取决于施法者的 DEX 和/或 AGI？（注 1）
// 注意：官方服务器上 DEX 和 AGI 都不影响延迟
delay_dependon_dex: no
delay_dependon_agi: no

// castbegin 后所有技能允许的最小延迟（毫秒）（注 1）
// 注意：设为大于 0 的值可以阻止加速外挂。
min_skill_delay_limit: 100

// 是否把攻击动作作为 castbegin 时的最小技能延迟？（注 1）
// 客户端通常不会以快于攻击动作的速度发送技能指令。
// 但有一些技巧可以让客户端更快地发送指令。
// 对于佣兵、人工生命体等某些单位类型，某些情况下
// 服务端没有足够的延迟，因此可以利用这些技巧
// 以快于攻击动作的速度使用技能。
// 如果想阻止这些技巧，并确保 castbegin 时的技能
// 间隔至少为攻击动作，请设为 "yes"。
amotion_min_skill_delay: no

// 此延迟是所有技能的最小“无法移动延迟”。
// 注意：不要设得太低。如果角色在施放技能后过早移动，
// 客户端不会更新，玩家看起来会像
// 之后“瞬移”了。怪物则使用 AttackMotion。
default_walk_delay: 300

// 完全禁用以下类型的技能延迟（注 3）
// 注意：默认情况下怪物没有 skill 数据库中指定的技能延迟，
//  而是遵循 mob 技能数据库中指定的
//  自身 'reuse' 技能延迟。设置后，所有技能的延迟变为
//  min_skill_delay_limit。
no_skill_delay: 2

// DEX 达到多少时吟唱时间变为 0（瞬发）？
castrate_dex_scale: 150

// (dex*2+int) 达到多少时可变吟唱变为 0？
vcast_stat_scale: 530

// 官方服务器在 castbegin 时应用攻击动作延迟，castend 时不再应用
// 攻击动作延迟。设为大于 0 的值后 castend 也会应用攻击动作延迟。（注 2）
// 注意：设置后会破坏有吟唱时间但无施法后延迟的技能连招。
// 客户端延迟因技能而异，通常在 140 到 180 之间。
// 如果注重安全，建议使用 90 到 140 之间的值。
skill_amotion_leniency: 0

// 普通攻击是否可以无视技能后的延迟？（注 1）
skill_delay_attack_enable: yes

// 吟唱结束后技能的额外射程。
// 决定技能开始吟唱后目标可以走多远才会导致技能失败。
// 0 禁用此射程检查（默认）
skill_add_range: 0

// 吟唱时目标移出范围，是否仍然扣除技能物品和 SP？（注 1）
skill_out_range_consume: no

// 施法者与目标的距离是否决定技能为远程技能？（注 3）
// 设置后，施法者与目标距离大于 3 时视为远程，否则为近战。
// 不设置时，由技能射程决定（大于 5 视为远程）。
// 默认 14（怪物 + 宠物 + 人工生命体）
skillrange_by_distance: 14

// 大多数武器技能中，装备武器的射程是否覆盖 skill_db 中定义的技能射程？（注 3）
// 注意：受此选项影响的技能是 skill_db 中射程为负数的技能。默认始终使用技能射程。
// 注意：如果希望所有怪物技能射程为 9，需要设置 monster_ai&0x400。
skillrange_from_weapon: 0

// 是否在所有技能攻击中检查施法者的状态？
// 设为 yes 后，陨石术、暴风雪等地面技能在
// 施法者无法战斗（如眩晕）时不会生效。
skill_caster_check: yes

// 施法者死亡后是否立即移除其放置的地面技能？（注 3）
clear_skills_on_death: 0

// 施法者换图时是否移除其放置的地面技能？（注 3）
clear_skills_on_warp: 15

//设为 YES 会把带 0x01 标志的地面技能目标模式覆盖为“非敌对”
//默认影响的两个技能是“光耀之堂”和“安全墙”（设为 yes 后只保护队友，不保护所有人）
//详情见 db/(pre-)re/skill_db.yml。
defunit_not_enemy: no

// 技能未命中/被格挡时，是否仍至少造成 'hits' 点伤害？
// 许多技能伤害会乘以攻击次数（见 skill_db），这些技能始终造成 1 HP
// 伤害/次，即使对植物也一样。但有些技能实际只有 1 次攻击，只是显示为多次
// 命中。对这些技能，伤害会除以次数并向下取整，因此植物不会受到
// 任何伤害。例如：音速投掷、维米尔之怒
// 通过此设置可以改变官方行为，让这些技能每次至少造成 1 HP 伤害。
// 取值：1 为武器攻击，2 为魔法攻击，4 为其他攻击。
skill_min_damage: 0

// 武僧连招的延迟倍率（注 2）
combo_delay_rate: 100

// 是否使用另一种自动反击技能类型？（注 3）
// 对应用此设置的角色，100% 暴击，
// 否则无视 DEF，HIT+20，CRI*2
auto_counter_type: 15

// 地面技能是否可以重叠放置？（注 3）
// 默认带有 UF_NOREITERATION 的技能不能重叠在
// 其他技能上，此设置会覆盖该行为。
skill_reiteration: 0

// 地面技能是否不能放在玩家/怪物脚下或附近？（注 3）
// 设置后，只影响带有 UF_NOFOOTSET 的技能。
skill_nofootset: 1

// GVG/PVP 场地内陷阱（猎人陷阱 + 泥沼地）的目标是否改为“所有”？（注 3）
// 官方服务器默认：1（对玩家）
gvg_traps_target_all: 1

// 陷阱可见性设置（带 UF_HIDDEN_TRAP 标志的陷阱）：
// 0 = 始终可见
// 1 = 在对抗地图（GVG/PVP/BG）中启用隐身
// 2 = 在所有地图中启用隐身
// 官方默认：复兴前 0，复兴后 2
//traps_setting: 0

// 炼金术士召唤技能的限制（按需添加）
// 1：允许玩家在对抗场地外攻击花
// 2：允许玩家在对抗场地外攻击海洋球
// 4：禁止同时存在不同类型的召唤物
//    （例如：已有水蛇时，禁止召唤水蛇以外的
//     任何召唤物）
// 8：允许海洋球在 PVP 外伤害自己的人工生命体和召唤物
// 官方默认：复兴前 15，复兴后 12
//alchemist_summon_setting: 15

// 放置类技能是否检查墙壁（注 1）
// （例如：贴着墙施放暴风雪不会打到墙的另一边。）
// 没有 "PathCheck" 单位标志的技能会忽略此设置。
skill_wall_check: yes

// 隐身时是否检查墙壁。（注 1）
// 注意：技能不检查墙壁时，你会始终被视为
//  旁边有墙（始终获得贴墙速度）。
//  按需组合设置，受到攻击始终会解除隐身。
// 
// 0 = 不检查墙壁
// 1 = 检查墙壁
// 2 = 攻击时不会取消隐身。
// 4 = 使用技能时不会取消隐身
player_cloak_check_type: 1
monster_cloak_check_type: 4

// 同一时间能放置的地面技能数量是否有限制（注 3）
land_skill_limit: 9

//决定发送哪种技能失败消息：
// 1 - 禁用所有技能失败消息。
// 2 - 禁用因行动延迟导致的技能失败消息。
// 4 - 禁用“偷窃”失败消息
// 8 - 禁用“涂毒”失败消息
display_skill_fail: 2

// 聊天室中的玩家是否会被传送门传送？（注 1）
chat_warpportal: no

// 巫师的“感知”技能应在防御栏显示什么？
// 0：不显示防御
// 1：基础防御 [复兴默认]
// 2：Vit/Int 防御
// 3：两者（相加）
sense_type: 1

// 使用哪种“六合拳”攻击风格？
// 0 = Aegis 风格（单次多段攻击）
// 1 = Athena 风格（多次连续攻击）
finger_offensive_type: 0

// 十字审判设置（不要随意修改）
// 官方设定中十字审判有 4 波伤害，但每格在已经造成至少 3 次
// 命中后，下一波就不再造成伤害。
// 移动中的怪物最多受 4 次命中，而怪物重叠时可能只受
// 1-3 次命中。
// 如果希望所有波次都伤害所有目标，请设为 yes。
// 提示：如果要减少波次，需要缩短技能的
// 持续时间（例如 800 毫秒对应 3 波伤害）。
gx_allhit: no

// 十字审判显示类型（默认 1）
// 0：角色显示为黄色
// 1：角色显示为白色
gx_disptype: 1

// “牺牲”允许的最大等级差
devotion_level_difference: 10

// 是否对“牺牲”与反射伤害使用旧行为？（注 2）
// 默认 0（官方）。如果 'devotion_rdamage' > 0（转移反射伤害的概率），
// 当带有“牺牲”的玩家攻击有反射伤害能力（物品或技能）的玩家时，
// 伤害将由提供“牺牲”的人承受，而不是攻击者。
devotion_rdamage: 0

// 官方设定中，反射盾（SC_REFLECTDAMAGE）会反射技能或普通攻击的物理伤害。
// 但如果目标处于“牺牲”状态，则只反射近战技能的伤害。（注 1）
devotion_rdamage_skill_only: yes

// AEGIS 上有一个 bug：处于“牺牲”状态的玩家坐着受到攻击时，
// 客户端会站起来，但服务端仍保持坐着状态。
// 因此玩家将无法再移动，直到重新坐下/站起或使用 @refresh。
// 详情见 https://github.com/rathena/rathena/issues/1927
// 默认：yes（我们推荐的修复方式）
// 官方：no
devotion_standup_fix: yes

// 设为 no 后可以单独使用合奏技能。（注 1）
player_skill_partner_check: yes

// 拆除陷阱类型
// 0 = Aegis 系统：返还 1 个“陷阱”物品
// 1 = Athena 系统：返还布置陷阱用掉的所有物品
skill_removetrap_type: 0

// 使用弓进行背刺是否承受 50% 伤害惩罚？（注 1）
backstab_bow_penalty: yes

// 可以从怪物身上尝试偷窃的次数。
// 注意：有助于避免针对稀有物品少的怪物进行偷窃刷取
// 设为 0 禁用（最大允许 255）
skill_steal_max_tries: 0

// 偷到的物品是否应用随机属性？（注 1）
// 官方：no
skill_steal_random_options: no

// “MVP 治愈”的等级和强度。当有人施放此等级或更高
// 的治愈术时，会跳过治愈公式并直接使用此值。
max_heal: 9999
max_heal_lv: 11

// 紧急召唤公会技能设置（按需添加）。
// 注意：要让技能可用，
// 至少需要 1/2 中的一个和 4/8 中的一个
// 1：可在攻城战外使用。
// 2：可在攻城战期间使用。
// 4：可在 GvG 场地外使用
// 8：可在 GvG 场地内使用
//16：禁止在 "nowarpto" 地图使用该技能
//    （但即使 GVG 城堡设为 nowarpto 仍然有效）
emergency_call: 11

// 公会光环技能设置（按需添加）。
// （影响 GD_LEADERSHIP、GD_GLORYWOUNDS、GD_SOULCOLD 和 GD_HAWKEYES）
// 注意：要让技能可用，
// 至少需要 1/2 中的一个和 4/8 中的一个
// 1：技能在攻城战外生效。
// 2：技能在攻城战期间生效。
// 4：技能在 GvG 场地外生效
// 8：技能在 GvG 场地内生效
//16：技能不影响公会会长
guild_aura: 31

// 怪物技能的最大可能等级
// 注意：如果 MVP 太强，可以降到 10。
mob_max_skilllvl: 100

// 允许玩家施放 1 级传送时跳过菜单
// 菜单包含两个选项：“随机”和“取消”
skip_teleport_lv1_menu: no

// 是否允许在非对应日期（日/月/星）使用星帝技能？
allow_skill_without_day: no

// 是否允许对玩家使用 ES 类魔法？
allow_es_magic_player: no

// “日月星之奇迹”技能概率
// 有效范围 1（每次 0.005%）到 20000（每次 100%）
// 如果 AGI 高于 46，概率会进一步降低（92 = 概率减半）
sg_miracle_skill_ratio: 1

// “日月星之奇迹”技能持续时间（毫秒）
sg_miracle_skill_duration: 3600000

// “日月星之天使”技能概率（100% = 10000）
sg_angel_skill_ratio: 10

// 受 bHealPower 影响的技能
// 1：治愈术，2： sanctuary，4：投药，8：纤细药水投掷，16：伊登的苹果，
// 32：集体治愈，64：高阶治愈，128：中和誓言，256：慈爱治愈
skill_add_heal_rate: 487

// 屏幕上只有单个目标时，地震的伤害是否可被反射。
// 注意：官方服务器上屏幕内只有一个目标时地震可被反射，
//	 这可能会被利用来刷 MVP。
eq_single_target_reflectable: yes

// 官方服务器上，即使处于无敌状态也会受到反射和某些塔罗牌伤害。
// 启用此设置后，可以免疫所有类型伤害，包括上述伤害。
// （会显示数字但不会实际造成伤害）
invincible.nodamage: no

// 跳舞时切换武器
// 官方服务器已修复：切换武器不能取消歌曲。
// 默认：yes
dancing_weaponswitch_fix: yes

// 技能陷阱类型
// 官方服务器上，单位完全免疫击退时，受到停止类状态（包括陷阱）
// 影响仍会走到最后一个目标格才停下。沿途的
// 所有陷阱都会被触发。
// 这不包括装备带来的击退免疫。该加成只对击退技能有效。
// 0：（官方）
// 1：GvG/攻城战中的停止效果会让单位立即停下。
// 2：停止效果使怪物免疫击退 / Boss 立即停下。
// 3: 1+2
skill_trap_type: 0

// 陷阱多重触发（注 1）
// 在 11.2 版本之前，同一间隔内陷阱会对每个踩上的单位触发
// 如果希望恢复这种旧行为，请启用
// 仅建议复兴前使用，因为复兴后陷阱伤害高得多
multi_trigger_trap: no

// “怒爆”连锁反应的区域（仅复兴前）
// 0：使用官方直线系统
// 1：不含半格 bug 的直线系统
// 2-20：以施法者为中心的区域（2 = 5x5，3 = 7x7，4 = 9x9，……，20 = 41x41）
// 注意：把目标击退出区域后只会命中一次，不会造成范围伤害
bowling_bash_area: 0

// 击退行为（注 1）
// 官方服务器上，撞墙时单位总是会停止移动。
// 设为 "no" 时，斜向接近墙壁会继续移动（旧版 Athena 行为）。
path_blown_halt: yes

// 跆拳道任务的怪物名称检查
// iRO Wiki 说明：如果目标是哥布灵，任何名为 "Goblin" 的怪物都会计入任务。
// 0：关闭（默认）
// 1：5 种哥布灵都会计入，无视怪物 ID（ID：1122-1126）- iRO 默认
// 2：任何名称完全相同的怪物都计入，无视怪物 ID - 按 jName 比较
taekwon_mission_mobname: 0

// 玩家能否传送到地图传送门上方？（注 1）
// 官方服务器上玩家无法这样做。
teleport_on_portal: no

// “手推车攻击”的击退方向是否始终为西？（注 1）
// 官方服务器上始终向西击退。禁用后则向后方击退。
cart_revo_knockback: yes

// 官方服务器上，“箭雨”的击退方向始终以技能施放位置到目标为准，而不是施法者到目标
arrow_shower_knockback: yes

// 官方服务器上，暴风雪由 81 个单位组成，每个单位造成 3x3 范围伤害并“远离中心”击退。由于
// 西南方向的格子先处理，通常会向东北击退。边缘的
// 击退会远离暴风雪。击退方向也会受“魔法效果解除”和“地元素领域”影响。如果
// 在暴风雪中打出缺口，会产生“吸入”效果。
// 禁用此设置后，击退方向将完全随机（eAthena 风格）。
stormgust_knockback: yes

// 关于 RENEWAL_CAST（注 2）
// 默认情况下，固定吟唱时间为 '-1' 的技能会把 20% 的吟唱时间
// 作为固定吟唱，其余 80% 作为可变吟唱。
// 设为 0 可禁用默认固定吟唱（等同于 skill_db.yml 中的 0）。
default_fixed_castrate: 20

// 官方服务器上，命中路径上所有目标的技能（如“集中射击”和“风之步”）会先
// 计算八个方向之一，再按该方向应用范围效果。这意味着可能存在
// 这类技能打不到的区域。如果目标在该区域内，则只会命中该怪物。
// 三转技能“火焰发射器”和“加农炮矛”可能完全落空。
// 设为 "no" 后改为计算施法者到目标的路径，并命中路径附近的所有目标。
// 可以在 skill_db 中调整 splash 和 maxcount 来改变这些技能的宽度和长度。
// 注意：“骑乘攻击”因其特殊伤害行为始终使用此算法。
skill_eightpath_algorithm: yes

// 使用 skill_eightpath_algorithm 的技能是否包含施法者所在格的目标？
// 官方：yes
skill_eightpath_same_cell: yes

// 是否可以伤害冰墙、陷阱等技能单位（注 3）
// 官方服务器上，玩家可以用技能伤害冰墙和部分陷阱。怪物使用技能时，
// 冰墙和陷阱上会显示伤害，但不会实际扣除耐久。
// 官方设置下很容易困住 MVP；如果希望所有单位都能
// 伤害技能单位（旧行为），请设为 31。
can_damage_skill: 1

// “地元素领域”行为（注 1）
// 官方服务器上，站在“地元素领域”边缘（外格）的玩家仍会受到
// 范围技能影响/伤害（如果技能有范围效果，如暴风雪）。Athena 行为会忽略
// 站在边缘时的范围影响/伤害。
// 官方：0
// 旧版 Athena：1
land_protector_behavior: 0

// NPC EMOTION 行为（注 1）
// 官方服务器上，某些怪物会施放 NPC EMOTION 技能显示表情，并在一定时间内
// 从主动变为被动。Athena 行为不会把它们变为被动。
// 官方：0
// 旧版 Athena：1
npc_emotion_behavior: 0

// “命运塔罗牌”是否每张牌出现概率相同？（注 1）
// 官方概率：15%：恋人 | 10%：愚者、魔术师、女祭司、力量、太阳 | 8%：节制
// 7%：战车 | 6%：倒吊人 | 5%：死神、星星 | 2%：塔 | 1%：命运之轮、恶魔
// 设为 "yes" 后，每张牌的概率变为 1/14。
tarotcard_equal_chance: no

// 目标不在歌曲范围内时，“魔法效果解除”是否对歌曲生效？（注 1）
// 官方服务器上无法解除歌曲。
// 提示：也会影响反叛者的“消失破坏者”技能。
dispel_song: no

// 重新进入歌曲范围时，歌曲增益持续时间是否刷新？（注 1）
// 官方设定：离开歌曲范围后增益持续时间变为有限，且在结束前无法刷新。
refresh_song: no

// 歌曲增益图标是否显示真实持续时间？（注 1）
// 设为 no 时始终显示为无限。
// 设为 yes 时，增益在无限/有限之间切换会更新图标。
// 注意：复兴客户端刷新图标时会再次显示增益动画。
refresh_song_icon: no

// 基因学者“制造炸弹”中香蕉炸弹的放置持续时间。
// 官方持续时间 = 1000ms * 投掷者职业等级 / 4。
// 0：使用官方持续时间
// X：输入自定义持续时间（毫秒）。
banana_bomb_duration: 0

// 背包没有空间时，尝试制作的物品是否掉落到地上？（注 1）
// 官方：no
// 旧版 rAthena 逻辑：yes
skill_drop_items_full: no

// EDP 设置：（注 3）
// 切换/卸下右手武器时是否移除 EDP？空手无法使用 EDP。
// 0：禁用（rAthena 旧版及复兴前行为）。
// 1：复兴前启用。
// 2：复兴后启用。
// 3: 1+2
switch_remove_edp: 2

// 对队伍其他成员施放机匠“攻击机器”时的最大等级差。
// 默认：15
attack_machine_level_difference: 15

// 是否修复“神之金属研究”？（注 1）
// “神之金属研究”原本应在制作 3 级武器时提高成功率。
// 但官方从未实现，实际没有任何效果。
// 设为 "yes" 后，“神之金属研究”每级提供 1% 成功率加成。
oridecon_research_fix: no
