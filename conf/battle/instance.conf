//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体）
//--------------------------------------------------------------

// 队伍、公会或氏族有活动副本时是否禁止离开？
// 默认：yes（官方）
instance_block_leave: yes

// 队伍或公会有活动副本时是否禁止更换队长/会长？
// 默认：yes（官方）
instance_block_leaderchange: yes

// 队伍或公会有活动副本时是否禁止邀请？
// 这也会阻止加入有运行中副本的队伍、公会或氏族。
// 默认：yes（官方）
instance_block_invite: yes

// 队伍或公会有活动副本时是否禁止踢人？
// 默认：yes（官方）
instance_block_expulsion: yes
