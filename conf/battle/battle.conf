//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// 谁应拥有 baseatk 值（使 STR 影响伤害）？（注 3）
enable_baseatk: 0x9
enable_baseatk_renewal: 0x29F

// 谁可以拥有完美回避？（注 3）
enable_perfect_flee: 1

// 谁可以拥有暴击攻击？（注 3）
// （注意：有些技能无视此设置始终暴击）
enable_critical: 17

// 非玩家单位的暴击调整倍率（注 2）
mob_critical_rate: 100
critical_rate: 100

// 哪些单位类型受到普通攻击时会产生移动延迟？（注 3）
// 延迟等于“攻击动画”（amotion）。客户端在这段时间内已经阻止
// 发送移动请求，所以对客户端控制的角色来说
// 此设置主要是防止客户端修改的安全机制。
// 怪物通常不受影响，因为它们的 AI 在攻击动画期间不活动，
// 除非你自定义了它们的 AI（见 monster.conf 的 monster_ai 0x2000）
attack_walk_delay: 0

// 是否使用旧版受伤移动延迟系统？（注 3）
// 官方设定：被击中时只是停在最近的格子中心。
// 此时移动延迟只影响怪物对伤害做出反应的时间。
// 旧系统会在移动延迟期间完全阻止移动指令，但
// 只有当目标在此前至少能移动一个延迟时长时才生效。
damage_walk_delay: 0

// 被击中后的移动延迟调整。（注 2）
// 被击中后的“无法移动”延迟按伤害动画时长的百分比计算。
// 对怪物来说，此延迟也决定它们多久后对攻击者做出反应。
pc_damage_walk_delay_rate: 20
damage_walk_delay_rate: 100

// 多段攻击的移动延迟调整。
// 被维米尔之怒、雷鸣术等多段技能命中时，角色会
// 额外无法移动“(攻击次数 -1) * multihit_delay”毫秒。
// 注意：超过 10 段攻击的技能只按 2 段技能计算。
// 此延迟也会加到怪物对攻击者做出反应前的等待时间上。
// 官方：200
// 旧版 Athena：80
multihit_delay: 200

// 玩家的受伤延迟倍率（注 2）
// 影响发送给客户端的伤害延迟，也是移动延迟的基础值。
player_damage_delay_rate: 100

// 是否始终拥有霸体？（注 3）
// 此处定义的单位类型不会因伤害而被打断。
// 注意：由于客户端限制，拥有霸体的目标无法显示暴击。
// 也就是说此设置会让这些单位类型无法显示暴击。
infinite_endure: 0

// 是否使用种族或属性判定为不死系？
// 0 = 属性不死；种族仍免疫冰冻和石化（官方）
// 1 = 种族不死
// 2 = 两者（任一满足）
// 3 = 属性不死；种族可被冰冻和石化（旧版 athena）
undead_detect_type: 0

// 被与自身相同属性的攻击命中时是否恢复 HP？（注 1）
attribute_recover: no

// 普通攻击命中率的最小值和最大值是多少？
min_hitrate: 5
max_hitrate: 100

// 当以玩家为目标的怪物超过 agi_penalty_count 时，对 FLEE 施加的惩罚类型
// 0 = 不施加惩罚
// 1 = 从 FLEE 中按百分比扣除 agi_penalty_num
// 2 = 从 FLEE 中按固定值扣除 agi_penalty_num
agi_penalty_type: 1

// 启用 AGI 惩罚时，应对谁生效？（注 3）
// 默认只有玩家会受到惩罚。
agi_penalty_target: 1

// 开始对 FLEE 施加惩罚前，需要有多少敌人以玩家为目标
agi_penalty_count: 3

// 超过 agi_penalty_count 后，每多一个攻击怪物扣除的 FLEE 量
agi_penalty_num: 10

// 当以玩家为目标的怪物超过 vit_penalty_count 时，对装备 DEF 和 VIT DEF 施加的惩罚类型
// 0 = 不施加惩罚
// 1 = 从 DEF 中按百分比扣除 vit_penalty_num
// 2 = 从 DEF 中按固定值扣除 vit_penalty_num
vit_penalty_type: 1

// 启用 VIT 惩罚时，应对谁生效？（注 3）
// 默认只有玩家会受到惩罚。
vit_penalty_target: 1

// 开始对防御施加惩罚前，需要有多少敌人以玩家为目标
vit_penalty_count: 3

// 超过 vit_penalty_count 后，每多一个攻击怪物扣除的 VIT 防御量
vit_penalty_num: 5

// 物理攻击是否使用另一种 DEF 计算方式。
// 0 为禁用（使用普通 def% 减免以及进一步的 def2 减免）
// 为 1 或更高时，防御按 (DEF * 数值) 做减法。
// 例如：10 + 50 防御变为 0 + (10*type + 50)
weapon_defense_type: 0

// MDEF 同上。（MDEF * 数值）
magic_defense_type: 0

// 每次攻击是否改变攻击者朝向对手？（注 3）
// 注意：官方服务器上，火墙等技能的击退方向始终基于
// 最后移动的方向。即使朝完全不同的方向攻击，
// 击退方向也不会改变。例如你向北走后再攻击南边的敌人，
// 仍会被火墙向南击退。不能移动的怪物
// 因为默认朝向北，所以始终会被向南击退。
attack_direction_change: 0

// 对设置的单位，其固有攻击属性为“无属性”
// （对所有防御属性均为 100%）（注 3）
// 注意：此设置让非玩家单位可以用普通攻击对
// 念属性目标造成全额伤害（例如对幽灵波利）。
attack_attr_none: 14

// 装备损坏概率（被任何技能修正前的基础概率）
// 1 = 0.01% 概率。官方默认：0
equip_natural_break_rate: 0

// 自身装备损坏的总倍率。（注 2）
// 此倍率影响“力量增幅”等技能的惩罚损坏率以及自然损坏率
// （来自 equip_natural_break_rate）。如果贤者的属性赋予失败且此值大于 0，
// 被选角色的武器会损坏。
equip_self_break_rate: 100

// 破坏目标装备的总倍率。（注 2）
// 影响“酸蚀恐怖”和“熔解”等技能的行为
equip_skill_break_rate: 100

// 伤害是否应有延迟后才生效？（注 1）
// 某些技能可能无视此设置默认没有延迟。
// 官方设置为 yes，尽管会稍微降低性能。
delay_battle_damage: yes

// 伤害时机是否应在客户端和服务端之间同步？（注 1）
// 这不是官方行为，但可以消除被怪物击中后的位置延迟。
// 此设置只影响普通怪物攻击，并优先于 "delay_battle_damage"。
// 许多技能会立即显示伤害，因此同时把 "delay_battle_damage" 设为 "no"
// 可能进一步改善体验，但并非对所有技能有效。
// 受够了暗影幻觉晚 5 秒才打中你？那就打开它。
synchronize_damage: no

// 使用弓/枪时是否消耗箭矢/弹药？
// 0 = No
// 1 = 是
// 2 = 即使技能未注明消耗箭矢，也消耗
//     前提是该技能为武器技能并使用远程武器（会自动判断
//     通过卡片或抄袭获得的技能是否应消耗弹药）
arrow_decrement: 1

// 卸下武器时是否卸下弹药？
// 官方行为为 "yes"。
ammo_unequip: yes

// 装备弹药时是否自动装备合适的武器？
// 官方行为为 "yes"。
ammo_check_weapon: yes

// 物品脚本奖励 'Autospell' 在施法前是否检查射程/障碍？
// 官方行为为 "no"，设为 "yes" 后技能会使用其定义的
// 射程。例如音速投掷需要 2 格距离才允许自动施法。
// 此设置也影响 autospellwhenhit。
autospell_check_range: no

// 如果攻击者和目标在同一格，目标是否应被击退到左侧？
// 官方行为为 "yes"，设为 "no" 会把目标击退到攻击者身后。
knockback_left: yes

// 玩家能否同时使用猎鹰和狼？（注 1）
// 官方服务器不允许。
warg_can_falcon: no

// 目标是否可以通过瞬移到屏幕边缘来躲避伤害？
// 官方行为为 "no"
snap_dodge: no

// 是否允许玩家技能/物品“破坏”非玩家装备。（注 1）
// 这实际上会对非玩家目标施加卸装效果。
// 注意：禁用时 WS_MELTDOWN 不受此检查限制。
// 官方：no
break_mob_equip: no
