//--------------------------------------------------------------
// rAthena 功能配置文件
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// 购买商店（注 1）
// 需要：2010-04-27aRagexeRE 或更新
feature.buying_store: on

// 商店搜索（注 1）
// 需要：2010-08-03aRagexeRE 或更新
feature.search_stores: on

// @命令建议（注 1）
// 输入不完整的 @命令 时，会提示完整的命令。
feature.atcommand_suggestions: off

// 拍卖（注 1）
// 该功能在 2012 年及之后的客户端上变得不稳定（具体日期未知），
// 但在 2013-05-15 及之后的客户端已修复。
// 该功能在 2014-11-12 及之后的客户端中再次被移除。
feature.auction: off

// 传送建议（注 1）
// 尝试 @warp 到不存在的地图时是否显示建议？
feature.warp_suggestions: off

// 银行（注 1）
// 需要：2013-07-24aRagexe 或更新
feature.banking: on

// 银行存取 zeny 时是否严格检查 UI 状态？（注 1）
// 注意：默认禁用，因为现有官方客户端不会向服务器报告银行 UI 状态。
// 但如果客户端确实会报告 UI 状态或使用自定义客户端，此配置会有用。
feature.banking_state_enforce: no

// 挂店持久化（注 1）
// 使用过 @autotrade 的商人是否在重启后恢复？
feature.autotrade: on

// 恢复的挂店商人应朝哪个方向？
// 可选值为 0-7
// 默认：4（南）
// -1 = 上次玩家的朝向
feature.autotrade_direction: 4

// 是否改变玩家头部朝向？
// -1 = 上次状态
//  0 = 前
//  1 = 右
//  2 = 左
feature.autotrade_head_direction: 0

// 挂店商人是否坐下？
// -1 = 上次玩家状态（坐或站）
//  0 = 站立
//  1 = 坐下
feature.autotrade_sit: 1

// 登录后打开露天商店/购买商店的延迟（毫秒）。
feature.autotrade_open_delay: 5000

// 战场排队界面。可以通过战斗菜单在任何地方排队战场。
// 需要：2012-04-10aRagexe 或更新
feature.bgqueue: on

// 转盘（注 1）
// 需要：2014-10-22bRagexe 或更新
feature.roulette: on

// 转盘额外奖励
// 如果奖励物品 ID 与额外物品 ID 相同，数量乘 2
feature.roulette_bonus_reward: on

// 成就（注 1）
// 需要：2015-05-13aRagexe 或更新
feature.achievement: on

// 精炼界面（注 1）
// 需要：2016-10-12aRagexeRE 或更新
feature.refineui: on

// 装备切换（注 1）
// 需要：2017-02-08bRagexeRE 或更新
feature.equipswitch: on

// 宠物进化（注 1）
// 需要：2014-10-08aRagexe 或更新
feature.petevolution: on

// 宠物自动喂食（注 1）
// 需要：2014-10-08aRagexe 或更新
feature.petautofeed: on

// 宠物自动喂食应在饥饿率达到多少时触发？（注 2）
// 默认：89
feature.pet_autofeed_rate: 89

// 人工生命体自动喂食（注 1）
// 需要：2017-09-20bRagexeRE 或更新
feature.homunculus_autofeed: on

// 人工生命体自动喂食应在比例达到多少时触发？（注 2）
// 默认：30
//
// 注意：
// 此设置仅在客户端 LUA 有 bug 时生效。
// 默认情况下，客户端在达到内部硬编码上限时会
// 自行发送喂食封包。
feature.homunculus_autofeed_rate: 30

// 签到系统（注 1）
// 需要：2018-03-07bRagexeRE 或更新
feature.attendance: on

// 私人飞艇系统（注 1）
// 需要：2018-03-21aRagexeRE 或更新
feature.privateairship: on

// 以物易物商店系统（注 1）
// 需要：2019-01-16RagexeRE 或更新
feature.barter: on

// 扩展以物易物商店系统（注 1）
// 需要：2019-11-06RagexeRE 或更新
feature.barter_extended: on

// 动态 NPC 未使用多久后消失的超时时间（毫秒）。
// 默认：60000（60 秒）
feature.dynamicnpc_timeout: 60000

// 动态 NPC 相对玩家生成的 x 范围。
// 默认：2
feature.dynamicnpc_rangex: 2

// 动态 NPC 相对玩家生成的 y 范围。
// 默认：2
feature.dynamicnpc_rangey: 2

// 动态 NPC 是否应面向玩家？（注 1）
// 默认：no
feature.dynamicnpc_direction: no

// 信息类命令的物品链接系统（注 1）
// 为物品生成物品链接字符串，可用于 npctalk、message、
// dispbottom 和 broadcast 命令。结果为可点击的物品名，
// 就像在背包/手推车/装备窗口按 SHIFT+点击一样。
// 需要：2015-11-04Ragexe 或更新
feature.itemlink: on

// NPC 消息的物品链接系统（注 1）
// 为物品生成物品链接字符串，可用于 NPC 的 mes 命令。
// 需要：2010-01-01 或更新
feature.mesitemlink: on

// 是否强制所有 mesitemlink 都用方括号包裹（注 1）
// 默认：no
feature.mesitemlink_brackets: no

// 是否强制所有 mesitemlink 使用数据库名称（注 1）
// 默认：no
feature.mesitemlink_dbname: no

// NPC 消息的物品图标（注 1）
// 为物品生成物品图标字符串，可用于 NPC 的 mes 命令。
// 需要：2023-03-02 或更新
feature.mesitemicon: on

// 如果禁用 mesitemicon 功能，是否强制所有 mesitemicon 使用数据库名称（注 1）
// 默认：no
feature.mesitemicon_dbname: no

// 造型师界面（注 1）
// 需要：2015-11-04 或更新
feature.stylist: on

// 是否允许玩家重新进入副本？（注 1）
// 复兴模式下默认启用，
// 复兴前模式下默认禁用。
// 如果允许，仍会遵守 "nosave" 地图标记，
// 可能阻止玩家传送回副本。
//feature.instance_allow_reconnect: yes
