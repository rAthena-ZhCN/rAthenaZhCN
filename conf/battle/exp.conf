//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：职业最大等级保存在经验表中。
//         修改 db/exp.txt 和 db/exp2.txt 可以调整。
//--------------------------------------------------------------

// 获得经验值的倍率。（注 2）
base_exp_rate: 100

// 获得职业经验值的倍率。（注 2）
job_exp_rate: 100

// 开启后允许玩家一次击杀连续升级多次。（注 1）
multi_level_up: no

// 是否允许连续升级到某个等级为止？
// 仅在启用 multi_level_up 时生效。
// 默认：0（不限制）
multi_level_up_base: 0
multi_level_up_job: 0

// 设置每次击杀可获得经验的最大上限，以当前经验条的
// 百分比表示。（每 10 = 1.0%）
// 例如设为 500，则无论怪物给多少经验，
// 最多也只能获得当前经验条的一半。
max_exp_gain_rate: 0

// 击败怪物时获得经验的计算方式：
// 0 = 以“造成的伤害 / 总伤害”作为伤害比例
// 1 = 以“造成的伤害 / 最大 HP”作为伤害比例
// 2 = 同 0，但第一个攻击者的伤害按两倍计算
exp_calc_type: 0

// 每多一个攻击者增加的经验。即每增加一个攻击者，
// 怪物给出的经验就增加这么多
// （例如：5 人攻击时此处设为 25，则 +(25*4)% -> +100% 经验）
exp_bonus_attacker: 25

// 经验加成达到上限时的最大攻击者数量
// （例如设为 5，则最多为 4 * 每人加成，与攻击者数量无关）
exp_bonus_max_attacker: 12

// 施放不造成伤害的技能是否仍算作攻击者？（注 1）
// 设为 yes 后，像“天使之怒”这类技能也会增加怪物给的经验。
// 官方设定是需要造成伤害才算。
exp_bonus_nodamage_attacker: no

// MVP 奖励经验倍率。（注 2）
mvp_exp_rate: 100

// NPC 给予的基础/职业经验倍率。（注 2）
quest_exp_rate: 100

// 使用“治愈术”获得的职业经验倍率（100 表示与治疗量相同，200 表示双倍，
// 经验倍率建议设置在 5 到 10 之间）
heal_exp: 0

// 复活过程中获得的经验倍率，单位是 0.01%。
// 计算公式：被复活者的经验值 * 等级差 / 100 * resurrection_exp / 10000。
resurrection_exp: 0

// 在 NPC 处使用“打折”和“高价卖出”时获得的职业经验倍率
// （以 0.01% 为单位——100 是 1%，10000 是正常，20000 是双倍。）
// 计算方式为（获得金钱 * 技能等级）* shop_exp / 10000。
shop_exp: 0

// PVP 经验。玩家在 PvP 地图中是否获得经验
// （注意：不是从玩家身上获得，而是正常的打怪升级）
pvp_exp: yes

// 玩家死亡时如何惩罚？
// 0 = 无惩罚。
// 1 = 死亡时损失当前等级的 %。
// 2 = 死亡时损失总经验的 %。
death_penalty_type: 1

// 基础经验惩罚比例（每 100 为经验的 1%）
death_penalty_base: 100

// 职业经验惩罚比例（每 100 为经验的 1%）
death_penalty_job: 100

// 玩家（被其他玩家击杀）死亡时，应扣除多少 zeny？
// 注意：这是持有 zeny 的百分比，100 = 1%
zeny_penalty: 0

// 满基础/职业等级的玩家死亡时是否损失经验？
// 0：从不损失（官方默认）。
// 1：损失基础经验。
// 2：损失职业经验。
death_penalty_maxlv: 0

// 是否显示击杀怪物获得的经验。（注 1）
disp_experience: no

// 是否显示获得的 zeny（来自怪物、交易等）。（注 1）
disp_zeny: no

// 重置属性点和升级时是否使用 db/statpoint.txt 的内容？（注 1）
// 选 no 时，会使用公式计算，以保留通过外部方式
// （如买卖属性点）获得/失去的属性点。
use_statpoint_table: yes

// 重置属性点和升级时是否使用 db/statpoint.yml 的内容？（注 1）
// 选 no 时，会使用公式计算，以保留通过外部方式
// （如买卖特性点）获得的特性点。
use_traitpoint_table: yes

// 施放 PR_REDEMPTIO 的经验消耗。（注 2）
exp_cost_redemptio: 1

// 需要多少名玩家才能使 PR_REDEMPTIO 的经验惩罚变为 0？
// 默认 exp_cost_redemptio 为 1（1%），每复活一名玩家惩罚减少 0.2%，
// 即 exp_cost_redemptio_limit 为 5。
exp_cost_redemptio_limit: 5
