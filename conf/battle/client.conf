//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵）
//--------------------------------------------------------------

// 私聊/全服/队伍/公会消息之间的最小延迟（毫秒）
// 低于此阈值的消息会被静默丢弃。
min_chat_delay: 0

// 客户端上染料和造型的有效范围。
min_hair_style: 0
max_hair_style: 42
min_hair_color: 0
max_hair_color: 8
min_cloth_color: 0 
max_cloth_color: 7

// 设为 yes 后，从攻城战地图发出的封包中伤害字段会被设为
// -1，使 GM、机器人和篡改客户端无法知道
// 攻击造成的实际伤害。（注 1）
hide_woe_damage: no

// 用于区分宠物的 "hair style" 编号。
// 注意：客户端使用怪物封包中的 "hair style" 字段来区分宠物和怪物。
// 此值始终高于该客户端可用的最大发型编号。
// 已知可用值（所有 2005 客户端）：
// 较旧的 sakexe：20
// sakexe 0614：24
// sakexe 0628（及以后）：100
pet_hair_style: 100

// 可见区域大小（玩家能看见多少格远）
area_size: 14

// 最大行走路径（玩家点击光标后最多走多少格）
max_walk_path: 17

// 单位封包中允许发送的最大 'level' 值。
// 与 aura_lv 设置配合，决定何时显示光环。
// 注意：要让此设置生效，还需要相应修改客户端。
// 注意：默认 99。大于 127 的值可能会表现异常。
// 注意：如果不清楚它的作用，请不要修改！！！
max_lv: 99

// 显示光环所需的等级。
// 注意：此设置假定向客户端发送 max_lv 就会显示光环。
// 注意：aura_lv 不能小于 max_lv。
// 例如：如果 max_lv 为 99、aura_lv 为 150，则 99~149 级角色
//          会被发送为全部 98 级，只有等级
//          150 及以上的角色才会被报告为 99 级并显示光环。
aura_lv: 99

// 受 max_lv 和 aura_lv 设置影响的单位类型。（注 3）
// 注意：如果某个通常不显示光环的单位类型
//       被设置，它在满足等级要求时也会获得光环。
// 默认：0（无）
client_limit_unit_lv: 0

// 穿着燕尾服和婚纱时是否显示？（注 1）
wedding_modifydisplay: no

// 是否保存衣服颜色。（会降低性能）（注 1）
save_clothcolor: yes

// 是否保存身体造型。（注 1）
save_body_style: yes

// 是否不显示婚礼职业的衣服颜色？
// 注意：save_clothcolor 和 wedding_modifydisplay 都必须启用
// 此选项才生效。如果衣服调色板包
// 没有婚礼调色板（或比其他职业少），请设为 yes
wedding_ignorepalette: no

// 是否不显示圣诞装的衣服颜色？
// 如果衣服调色板包没有圣诞调色板（或比其他职业少），请设为 yes
xmas_ignorepalette: no

// 是否不显示夏季装的衣服颜色？
// 如果衣服调色板包没有夏季调色板（或比其他职业少），请设为 yes
summer_ignorepalette: no

// 是否不显示韩服的衣服颜色？
// 如果衣服调色板包没有韩服调色板（或比其他职业少），请设为 yes
hanbok_ignorepalette: no

// 是否不显示啤酒节装的衣服颜色？
// 如果衣服调色板包没有啤酒节调色板（或比其他职业少），请设为 yes
oktoberfest_ignorepalette: no

// 如果客户端有 langtype 问题无法正常显示 motd，请设为 1
motd_type: 0

// 登录时是否向用户显示 rAthena 版本？
display_version: yes

// 受到“幻觉”状态影响时，是否向客户端发送效果？（注 1）
// 注意：如果客户端因“波浪”屏幕效果卡顿，请设为 'no'。
display_hallucination: yes

// 如果客户端支持状态变化计时器并希望使用，请设为 1
// 2009 年及之后的客户端支持此功能
display_status_timers: yes

// 是否在服务端随机化骰子表情，防止客户端伪造
// 封包来获得想要的点数。（注 1）
client_reshuffle_dice: yes

// 是否在发送给客户端前排序手推车、公会仓库、背包和仓库。（注 1）
// 官方服务器不排序。
// 注意：启用此选项会降低性能。
client_sort_storage: no

// 隐身状态下是否更新敌人位置？（注 1）
// 注意：设为 'no' 后，除非玩家有“透视”效果，客户端不会更新敌人位置。
//       这有助于客户端应对 WPE - Maya Purple 外挂。
//       但会破坏隐身状态下玩家的“游戏动画显示”。
update_enemy_position: yes

// 玩家传送、换图或登录后，是否面向传送前的朝向？
// 官方：禁用，玩家始终面向北。
spawn_direction: no

// 是否为 2013-12-23cRagexe 及更新客户端显示 MVP 经验奖励消息？（注 1）
// kRO 移除了该封包，此设置可重新启用消息。
// 官方：禁用。
mvp_exp_reward_message: no

// 发送 ping 计时器
// 每个计时器触发的间隔（秒）。
ping_timer_inverval: 30

// 发送封包超时（秒），超时后才能发送 ping 包。
ping_time: 20

// 是否为 2015-12-23 及更新客户端显示技能范围？（注 1）
// 官方：yes
show_skill_scale: yes

// 收到玩家断线请求后，是否在服务端断开连接？（注 1）
// 注意：已知启用后会对使用 REST API 调用的客户端造成问题。
// 官方：no
drop_connection_on_quit: no

// 外挂检测重试次数
// 允许失败多少次外挂检测后才封禁。
// 官方：3（最小：1）
macro_detection_retry: 3

// 外挂检测超时
// 外挂检测失败并封禁用户前的毫秒数。
// 官方：60000
macro_detection_timeout: 60000

// 外挂检测惩罚类型
// 0 - 封禁
// 1 - 监禁
// 官方：0
macro_detection_punishment: 0

// 外挂检测惩罚时长
// 惩罚类型生效的分钟数。使用 0 表示无限。
// 官方：0
macro_detection_punishment_time: 0

// 外挂检测延迟（每张地图）
// 设为 0 禁用
macrochecker_delay: 600000

// 进入视野范围时是否隐藏隐身单位？（注 3）
// 默认（官方）：0
hide_cloaked_units: 0
