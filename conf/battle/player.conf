//--------------------------------------------------------------
// rAthena 战斗配置文件
// 原译者：Peter Kieser <pfak@telus.net>
// 由 Ancyker 改写为更通俗的英文
//--------------------------------------------------------------
// 注 1：值为开关（on/off、yes/no 或 1/0）
// 注 2：值为百分比（100 表示 100%）
// 注 3：值为位字段。如果没有特别说明，
//         则按单位类型理解（1: 玩家，2: 怪物，4: 宠物，8: 人工生命体，16: 佣兵，128: NPC，512: 元素精灵）
//--------------------------------------------------------------

// 玩家最大 HP 倍率？（默认 100）
hp_rate: 100

// 玩家最大 SP 倍率？（默认 100）
sp_rate: 100

// 左手的卡片和属性是否作用于右手攻击（注 1）
// （官方服务器为 yes）
left_cardfix_to_right: yes

// 玩家复活时拥有的 HP 量，0 为默认值。
// （单位为总 HP 的百分比，100 为满血，0 为复活时只有 1 HP。）
restart_hp_rate: 0

// 玩家复活时拥有的 SP 量，0 为默认值。
// （单位为总 SP 的百分比，100 为满 SP，0 为复活时只有 1 SP。）
restart_sp_rate: 0

// 普通玩家是否可以跳过技能树？（注 1）
player_skillfree: no

// 设为 yes 时，强制把一转获得的技能点投入一转
// 技能，并强制把初学者技能点投入基本技能。（注 1）
player_skillup_limit: yes

// 是否可以学习任务技能？（注 1）
// 设为 yes 可能给服务器带来漏洞！
quest_skill_learn: no

// 重置技能时，任务技能是否也重置？（注 1）
// 设为 yes 可能给服务器带来漏洞！
// 注意：如果 quest_skill_learn 设为 yes，任务技能总是会被重置。
quest_skill_reset: no

// 必须拥有基本技能才能坐下、交易、组队或创建聊天室？（注 1）
basic_skill_check: yes

// 传送或在地图出生后，若玩家不移动，怪物多久后会发现你？（毫秒）
// 也就是说，进入地图后不移动，怪物多久会注意到你。
// 如果攻击怪物，无论此设置如何，怪物都会反击。
// 在这段时间内，你也不会受到伤害。
// 可以用地图标记 'invincible_time' 为特定地图覆盖此值。
player_invincible_time: 3000

// HP 自然恢复的时间间隔。（毫秒）
natural_healhp_interval: 6000

// SP 自然恢复的时间间隔。（毫秒）
natural_healsp_interval: 8000

// 自动治疗技能的时间间隔。（毫秒）
natural_heal_skill_interval: 10000

// 角色自然恢复停止前的最大负重。（注 2）
// 根据此设置，你可能需要修改 data 中对应的 TGA 图片，
// 以便在状态图标中显示正确的百分比。
// 官方默认：复兴前 50，复兴后 70
//natural_heal_weight_rate: 70

// 角色从物品箱获得物品的最大负重。（注 2）
// 官方默认：复兴前 70，复兴后 90
//open_box_weight_rate: 90

// 角色进入“超重”状态前的最大负重。（注 2）
// 在此状态下角色无法自然恢复、攻击或使用技能。
major_overweight_rate: 90

// 最大攻击速度。（默认 190，最高 199）
max_aspd: 190

// 同 max_aspd，但适用于三转职业。（默认 193，最高 199）
max_third_aspd: 193

// 扩展职业（影狼/胧、反叛者）的最大 ASPD。（默认 193，最高 199）
max_extended_aspd: 193

// 召唤师（喵族）职业的最大 ASPD。（默认 193，最高 199）
max_summoner_aspd: 193

// 最大移动速度倍率（200 表示最多为正常速度的两倍）
max_walk_speed: 300

// 按基础等级决定的最大 HP。默认值如下：
// Lv 99:  330000
// Lv150:  660000
// Lv175: 1100000
max_hp_lv99: 330000
max_hp_lv150: 660000
max_hp: 1100000

// 最大 SP。（默认 1000000）
max_sp: 1000000

// 各职业的最大属性值（str、agi、vit、int、dex、luk）
// 'max_parameter' 用于初学者、非转生、非宝宝、非三转职业
// 'max_trans_parameter' 用于转生职业（非三转转生）
// 'max_third_parameter' 用于三转职业（普通/非转生），宝宝三转除外
// 'max_third_trans_parameter' 用于三转转生职业
// 'max_baby_parameter' 用于宝宝职业，宝宝三转除外
// 'max_baby_third_parameter' 仅用于宝宝三转职业
// 'max_extended_parameter' 用于扩展二转职业（影狼/胧、反叛者）
// 更具体的设置见 'db/[pre-]re/job_params_db.txt'
max_parameter: 99
max_trans_parameter: 99
max_third_parameter: 130
max_third_trans_parameter: 130
max_baby_parameter: 80
max_baby_third_parameter: 117
max_extended_parameter: 130
max_summoner_parameter: 130
max_fourth_parameter: 130

// 转生职业的状态点奖励
transcendent_status_points: 52

// 最大防具 DEF/MDEF
// 注意：服务器以复兴模式（RENEWAL）运行时此设置无效
// 注意：不影响技能和“钢铁之心”等状态效果
// 如果 weapon_defense_type 非 0，则不会作用于最大 DEF。
// 如果 magic_defense_type 非 0，则不会作用于最大 MDEF。
max_def: 99

// 防御转换为 Def2 的加成。如果防具 DEF/MDEF 超过 max_def，
// 超出部分会用此系数转换为 VIT 防御/INT 魔防
// （例如设为 10，则超过上限的每点防具防御变为 10 点 VIT 防御）
over_def_bonus: 0

// 手推车可承载的最大重量。
max_cart_weight: 8000

// 被攻击后多久内禁止退出（毫秒，0 为禁用）？
prevent_logout: 10000

// 服务器应在何时阻止玩家退出？prevent_logout 关闭时无效。（注 3）
// 官方服务器在攻击、施放技能和受到伤害后阻止玩家退出。
// 0 = 玩家始终可以退出
// 1 = 登录时禁止退出
// 2 = 攻击后禁止退出
// 4 = 施放技能后禁止退出
// 8 = 受到攻击后禁止退出
prevent_logout_trigger: 14

// 是否显示普通攻击吸取的 HP/SP 数值？（例如：猎蝇卡）
show_hp_sp_drain: no

// 是否显示击杀怪物获得的 HP/SP 数值？（例如：天邪鬼卡）
show_hp_sp_gain: yes

// 如果启用，当 A 接受 B 为好友时，B 也会被加入 A 的好友
// 列表，否则只有 A 会出现在 B 的好友列表中。
// 注意：此设置会启用好友自动添加和自动删除。
friend_auto_add: yes

// 同时收到的交易/组队/公会邀请是否自动拒绝？
invite_request_check: yes

// 玩家被击杀时是否掉落“骷髅”？
// 注意：“骷髅”（ID 7420）默认禁止交易。需要
// 移除该物品的 "NoTrade" 标记，此功能才会生效。
// 0 = 禁用
// 1 = 仅在 PvP 地图掉落
// 2 = 所有情况下都掉落
bone_drop: 0

// 骑乘（波利坐骑）的角色体型是否变大？
// 0 = no
// 1 = 只有普通职业骑乘时变为大体型
// 2 = 只有宝宝职业骑乘时变为中体型
// 3 = 普通职业骑乘变为大体型
//	且宝宝职业骑乘变为中体型
character_size: 0

// 挂机角色能否获得自动拾取？
// 设置为秒数后，挂机角色将停止从自动拾取
// 获得物品（0：禁用）。
idle_no_autoloot: 0

// 露天商店/聊天室与 NPC 之间必须保持的最小距离。
// 默认：3（0：禁用）。
min_npc_vendchat_distance: 3
 
// 租赁坐骑应提高玩家多少移动速度？
// 默认 25。100 = 提高 100%。
rental_mount_speed_boost: 25

//===================================
// VIP 系统
//===================================
// 仓库格子增加。设为 0 则禁用。
// 在 MIN_STORAGE 限制之上提供更多仓库格子。
// 注意：MIN_STORAGE + vip_storage_increase 不能超过 MAX_STORAGE。
// 默认：300
vip_storage_increase: 300

// 基础经验倍率增加。设为 0 则禁用。（注 2）
// 默认：50
vip_base_exp_increase: 50

// 职业经验倍率增加。设为 0 则禁用。（注 2）
// 默认：50
vip_job_exp_increase: 50

// VIP 账号的经验惩罚倍率。
// 默认：100（100 = 1% 惩罚）
vip_exp_penalty_base: 100
vip_exp_penalty_job: 100

// VIP 账号的 zeny 惩罚。
// 仅在玩家被其他玩家击杀时才会损失 zeny。
// 默认：0（100 = 1% 惩罚）
vip_zeny_penalty: 0

// 战斗手册经验增加。设为 0 则禁用。
// - 普通/厚战斗手册：50+(50/X) = 75%
// - HE 战斗手册：100+(100/X) = 150%
// - 战斗手册 x3：200+(200/X) = 300%
// 注意：X 为此处的配置值。
// 默认：2
vip_bm_increase: 2

// 物品掉落增加。设为 0 则禁用。
// 注意：50 = item_drop 增加 50%。
// 例如 item_rate = 200：200 * 50 / 100 = 100，加到 200 基础值上，总倍率为 300。
// 默认：50
vip_drop_increase: 50

// 宝石需求。
// VIP 组是否可以无视技能宝石需求？
// 0 = 禁用
// 1 = 效果同“女武神卡片”
// 2 = 移除所有宝石需求（默认）
vip_gemstone: 2

// 是否显示倍率信息（经验、掉落和死亡惩罚消息）？（注 1）
vip_disp_rate: yes

// 传送时是否复活死亡玩家？（注 1）
revive_onwarp: yes

// 获得跆拳道排名者奖励的最低基础等级
// - 最大 HP 和 SP 变为 3 倍
// - 所有跆拳道技能
taekwon_ranker_min_lv: 90

// 获得的声望点
// 完成跆拳道任务
fame_taekwon_mission: 1
// 将自己锻造的武器精炼到 +10
fame_refine_lv1: 1
fame_refine_lv2: 25
fame_refine_lv3: 1000
// 用 3 个额外材料成功锻造 3 级武器
fame_forge: 10
// 锻造武器精炼到 +10 时给予点数的精炼阈值
blacksmith_fame_refine_threshold: 10
// 连续成功制作 'n' 个浓缩药水
fame_pharmacy_3: 1
fame_pharmacy_5: 3
fame_pharmacy_7: 10
fame_pharmacy_10: 50

// 服务器如何判定角色的挂机时间？（注 3）
// 0x0001 - 移动请求
// 0x0002 - 对目标使用技能请求
// 0x0004 - 对地面使用技能请求（范围技能）
// 0x0008 - 使用物品请求（包括穿脱装备）
// 0x0010 - 攻击请求
// 0x0020 - 聊天请求（私聊、队伍、公会、战场等）
// 0x0040 - 坐下/站起请求
// 0x0080 - 表情请求
// 0x0100 - 丢弃物品请求
// 0x0200 - @/# 命令请求
// 0x0400 - 关闭 NPC 窗口
// 0x0800 - 向 NPC 输入内容
// 0x1000 - 选择 NPC 菜单项
// 0x2000 - 点击 NPC 的下一步按钮
// 0x4000 - 完成 NPC 进度条
// 请注意：至少要启用 1 个选项。
// 注意：启用的选项越多，依赖挂机时间的功能（如 checkidle()）越容易被绕过。
// 默认：移动（0x1）+ 对目标用技能（0x2）+ 对地面用技能（0x4）+ 使用物品（0x8）+ 攻击（0x10）+ 任意 NPC 交互（0x400,0x800,0x1000,0x2000,0x4000）= 0x7C1F
idletime_option: 0x7C1F

// 调整召唤师职业的特殊属性。
// - 召唤师属于 brute 种族。它们有独立的种族 RC_PLAYER_DORAM (11)，以区别于怪物种族 RC_BRUTE (2)。
// - 召唤师体型为小（0）而不是中（1）
summoner_race: 11
summoner_size: 0

//================================
// 四转职业系统
//================================
// 玩家转四转时获得多少特性点？
// 默认：7
trait_points_job_change: 7

// 特性属性上限。
// 特性属性：POW、STA、WIS、SPL、CON、CRT
// 官方为 110。
max_trait_parameter: 110

// 物品/技能可以无视的 RES/MRES 最大百分比。
// 默认：50
max_res_mres_ignored: 50

// 最大 AP
// 默认：1000
max_ap: 1000

// 玩家最大 AP 倍率？（默认 100）
ap_rate: 100

// 玩家复活时拥有的 AP 量，0 为默认值。
// （单位为总 AP 的百分比，100 为满 AP，0 为复活时 0 AP。）
restart_ap_rate: 0

// 玩家死亡时是否损失 AP？
// 默认：yes
loose_ap_on_death: yes

// 玩家进入 PVP/GVG/攻城战/战场地图时是否损失 AP？
// 默认：yes
loose_ap_on_map: yes

// 玩家退出时是否保留 AP？
// 默认：yes
keep_ap_on_logout: yes
