###########################################################################
# 玩家组数据库
###########################################################################
#
# 玩家组设置
#
###########################################################################
# - Id                    组 ID。
#   Name                  组名称。
#   Level                 用于组排序的 GM 等级。（默认：0）
#   LogCommands           @命令是否记录日志。（默认：false）
#   Commands:             此组可使用的 @命令列表。（默认：无）
#     <atcommand name>    指定 @命令是否可被此组使用。
#   CharCommands:         此组可使用的 charcommand 列表。（默认：无）
#     <charcommand name>  指定 charcommand 是否可被此组使用。
#   Permissions:          此组拥有的权限列表。（默认：无）
#     <permission name>   此组是否拥有该权限。
#   Inherit:              要继承的组列表。（默认：无）
#     <group name>        是否继承该组。
###########################################################################

Header:
  Type: PLAYER_GROUP_DB
  Version: 1

Body:
  - Id: 0
    # 组 0 是每个新账号的默认组
    Name: Player
    Level: 0
    Commands:
      changedress: true
      resurrect: true
    Permissions:
      # 没有这些基础权限，普通玩家将无法交易或组队
      can_trade: true
      can_party: true
      attendance: true
  - Id: 1
    Name: Super Player
    # 可以做玩家能做的一切，甚至更多
    Inherit:
      Player: true
    Level: 0
    Commands:
      # 信息类命令
      commands: true
      charcommands: true
      help: true
      rates: true
      uptime: true
      showdelay: true
      exp: true
      mobinfo: true
      iteminfo: true
      whodrops: true
      servertime: true
      jailtime: true
      hominfo: true
      homstats: true
      showexp: true
      showzeny: true
      whereis: true
      # 功能类命令
      refresh: true
      noask: true
      noks: true
      autoloot: true
      alootid: true
      autoloottype: true
      autotrade: true
      request: true
      go: true
      breakguild: true
      channel: true
      langtype: true
    Permissions:
      attendance: false
  - Id: 2
    Name: Support
    Inherit:
      Super Player: true
    Level: 1
    Commands:
      version: true
      where: true
      jumpto: true
      who: true
      who2: true
      who3: true
      whomap: true
      whomap2: true
      whomap3: true
      users: true
      broadcast: true
      localbroadcast: true
    LogCommands: true
    Permissions:
      receive_requests: true
      view_equipment: true
  - Id: 3
    Name: Script Manager
    Inherit:
      Support: true
    Level: 1
    Commands:
      tonpc: true
      hidenpc: true
      shownpc: true
      loadnpc: true
      unloadnpc: true
      npcmove: true
      addwarp: true
    LogCommands: true
    Permissions:
      any_warp: true
  - Id: 4
    Name: Event Manager
    Inherit:
      Support: true
    Level: 1
    Commands:
      monster: true
      monstersmall: true
      monsterbig: true
      killmonster2: true
      cleanarea: true
      cleanmap: true
      item: true
      zeny: true
      disguise: true
      undisguise: true
      size: true
      raise: true
      raisemap: true
      day: true
      night: true
      skillon: true
      skilloff: true
      pvpon: true
      pvpoff: true
      gvgon: true
      gvgoff: true
      allowks: true
      me: true
      marry: true
      divorce: true
      refreshall: true
    CharCommands:
      item: true
      zeny: true
      disguise: true
      undisguise: true
      size: true
    LogCommands: true
    Permissions:
      can_trade: false
      any_warp: true
  - Id: 5
    Name: VIP
    # 可以做玩家能做的一切
    Inherit:
      Player: true
    Level: 0
    Commands:
      rates: true
      who: true
  - Id: 10
    Name: Law Enforcement
    Inherit:
      Support: true
    Level: 2
    Commands:
      hide: true
      follow: true
      kick: true
      disguise: true
      fakename: true
      option: true
      speed: true
      mapmove: true
      kill: true
      recall: true
      ban: true
      block: true
      jail: true
      jailfor: true
      mute: true
      storagelist: true
      cartlist: true
      itemlist: true
      stats: true
    LogCommands: true
    Permissions:
      join_chat: true
      kick_chat: true
      hide_session: true
      who_display_aid: true
      hack_info: true
      any_warp: true
      view_hpmeter: true
      macro_detect: true
  - Id: 99
    Name: Admin
    Level: 99
    Inherit:
      Support: true
      Law Enforcement: true
    LogCommands: true
    Permissions:
      can_trade: true
      can_party: true
      command_enable: true
      all_skill: false
      all_equipment: false
      skill_unconditional: false
      use_check: true
      use_changemaptype: true
      all_commands: true
      channel_admin: true
      can_trade_bounded: true
      item_unconditional: false
      bypass_stat_onclone: true
      bypass_max_stat: true
      macro_register: true
      trade_unconditional: true
      #all_permission: true

Footer:
  Imports:
  - Path: conf/import/groups.yml
