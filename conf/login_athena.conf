// Athena 登录服务器配置文件。
// Translated by Peter Kieser <pfak@telus.net>

// 注意：注释是双斜杠 "//" 右侧的所有文本
// 注释中的任何文本都不会被服务器解析，仅作为
// 信息/参考使用。

// 登录服务器监听此 IP 地址对应的网卡接口。
// 注意：这样可以在多个网卡接口上运行多个服务器
// 同时让每个服务器使用相同的端口。
//bind_ip: 127.0.0.1
 
// 登录服务器连接端口
login_port: 6900

// 每条消息前打印的时间戳格式。
// 最多 20 个字符。
// 常用格式：
// %I:%M:%S %p（时:分:秒，12 小时制，AM/PM）
// %H:%M:%S（时:分:秒，24 小时制）
// %d/%b/%Y（日/月/年）
// 完整格式请参考 strftime() 手册。
//timestamp_format: [%d/%b %H:%M]

//重定向输出转义序列（颜色代码组）
stdout_with_ansisequence: no

// 服务器选择日志/文件夹中的消息类型
// 1: Log 警告消息
// 2: Log 错误和 SQL 错误消息.
// 4: Log 调试消息
// 例: "console_msg_log: 7" 记录全部3种
// 记录的消息由这个覆盖 console_silent 设置
console_msg_log: 0

// 存储以上设置的控制台信息途径
console_log_filepath: ./log/login-msg_log.log

// 服务器视窗 消息简略显示设置
// 1: 隐藏普通信息
// 2: 隐藏状态信息
// 4: 隐藏注意信息
// 8: 隐藏警告信息
// 16: 隐藏错误及SQL错误信息
// 32: 隐藏调试消息
//举例: 设置为7则隐藏[普通]、[状态]和[注意]的消息 (1+2+4累加)
console_silent: 0

// 控制台指令
// 控制台指令设置参数使用  on和off
// 是否记录日志到log文件夹
console: off

// 是否允许游戏客户端登录账号在号面增加“_M/_F”注册新的账号?
// 注意: 这仅在登录器不具备密码加密功能才有效.
new_account: no

// 如果启用 new_account，此值设置账号名的最小长度。
// 默认是 '4' 或 '6'（取决于新版登录界面）。
// 除非客户端使用了“移除 4/6 字符用户名限制”补丁，否则不要修改。
//acc_name_min_length: 6

// 如果启用 new_account，此值设置密码的最小长度。
// 默认是 '4' 或 '6'（取决于新版登录界面）。
// 除非客户端使用了“移除 4/6 字符密码限制”补丁，否则不要修改。
//password_min_length: 6

// 账号注册保护系统
// allowed_regs 中的数字是在 time_allowed 时间内允许的注册人数(秒)
allowed_regs: 1
time_allowed: 10

// 日志文件名. 服务器登录的所有操作纪录在此文件.
login_log_filename: log/login.log

// 是否纪录登陆服务器日志?
// 注意：登录服务器需要登录日志才能启用动态密码失败封禁。
log_login: yes

// 对玩家显示的时间格式, 日志记录的时间格式..等各种项目的时间格式.
date_format: %Y-%m-%d %H:%M:%S

// 连接服务器所需的账号组 ID。
// -1: 关闭
// 0 或更大：组 ID
group_id_to_connect: -1

// 连接服务器所需的最低账号组 ID。
// 如果启用了 group_id_to_connect，此项不生效。
// -1: 关闭
// 0 或更大：组 ID
min_group_id_to_connect: -1

// 设置 VIP 使用的群组 (ID)
// 默认: 5
vip_group: 5

// 用户能创建的人物数量
// 不能超过 MAX_CHARS 的设置上限, 定义 mmo.hpp, 或 chars_per_account
// 默认为 MAX_CHARS 设置值
// 设置 0 将使用 MIN_CHARS 原来的设置值
chars_per_account: 0

// 增加 VIP用户创建人物数量 (0 表示停用)
// 若要提高 vip_char_increase 上限，必须先修改 MAX_CHARS 上限
// 注意: VIP人物创建数量 = MAX_CHARS - chars_per_account.
// 注意 2: 先设置 chars_per_account 后，在进行此设置.
// -1 表示使用 MAX_CHAR_VIP 默认值（src/config/core.hpp）
vip_char_increase: -1

// 对新建账户开始以秒为单位计时
// -1: 新建账户将拥有无限的使用期限(默认值)
// 0 或更多: 新建的账户将可以使用到   现行时间加上这个参数的值的时间
start_limited_time: -1

// Login数据库的密码为MD5码 ?
// 注意: 当登录器具备 <密码加密> 功能时不可使用
use_MD5_passwords: no

// 登录窗口在线玩家状态显示 (要求 PACKETVER >= 20170726)
// 是否禁止显示玩家空闲/拥挤状态?
usercount_disable: no
// 显示绿色状态的玩家数量
usercount_low: 200
// 显示黄色状态的玩家数量
usercount_medium: 500
// 显示红色状态的玩家数量
usercount_high: 1000

// 封闭账号特性
ipban_enable: yes
// 动态密码失败次数封禁 IP 系统
// 失败达到一定次数后是否封禁？
ipban_dynamic_pass_failure_ban: yes
// 统计失败次数的间隔（分钟）。
ipban_dynamic_pass_failure_ban_interval: 5
// 封禁前允许的最大失败次数。
ipban_dynamic_pass_failure_ban_limit: 7
// 封禁持续时间（分钟）。
ipban_dynamic_pass_failure_ban_duration: 5
// 间隔（以秒为单位） 清除被封锁的到期IP. 0 = 关闭. 默认值 = 60.
// 如果 IP 封禁记录已过期，玩家仍然可以登录。
ipban_cleanup_interval: 60

// 执行 DNS/IP 更新的间隔（分钟）。默认关闭。
// 如果服务器使用随时间变化的动态 IP，请启用。
//ip_sync_interval: 10

// DNS黑名单封锁
// 如果启用, 每个进入的连接将被测试对黑名单上的指定
// dnsbl_servers (逗号-分隔列表)
use_dnsbl: no
dnsbl_servers: bl.blocklist.de, socks.dnsbl.sorbs.net
// 以下是一些免费的 DNS 黑名单服务：http://en.wikipedia.org/wiki/Comparison_of_DNS_blacklists
//==============================================================================
//   dnsbl_servers                 说明
// - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
// bl.blocklist.de                 通过 SSH、FTP、IMAP 等攻击其他服务器/蜜罐的 IP。
// ircbl.ahbl.org                  AHBL（开放代理、被入侵主机、评论垃圾邮件发送者）
// safe.dnsbl.sorbs.net            dnsbl.sorbs.net 中除 "recent" 和 "escalations" 外的所有区域
// sbl-xbl.spamhaus.org            Spamhaus 黑名单（垃圾邮件发送者、开放代理）
// socks.dnsbl.sorbs.net           开放 SOCKS 代理服务器
// tor.ahbl.org                    当前的 Tor 中继和出口节点

// 登录器 MD5 hash 检查
// 如果开启, 登录服务器将检查登录器 hash 值
// 并且不会篡改登录器连接.
// 注意：有关详细信息，请参阅 doc\md5_hashcheck.txt
client_hash_check: off

// 是否启用网络身份验证系统
// 通过 HTTP 附加的 API 数据获取客户端的验证
use_web_auth_token: yes

// 角色退出后延迟多少毫秒禁用 webtoken
// 客户端退出时存在竞态条件，char-server 可能在
// 客户端保存配置之前就吊销令牌。
disable_webtoken_delay: 10000

// 客户端 MD5 哈希
// 使用指定哈希的客户端，允许账号组 ID 大于等于
// 给定值的玩家登录。
// 如果哈希填 'disabled'，账号组 ID 大于等于
// 给定值的玩家将不受哈希限制（即使
// 客户端根本没有发送哈希也可以）。
// 格式：group_id, hash
// 注意：详情见 'doc/md5_hashcheck.txt'。
//client_hash: 0, 113e195e6c051bb1cfb12a644bb084c5
//client_hash: 10, cb1ea78023d337c38e8ba5124e2338ae
//client_hash: 99, disabled

import: conf/inter_athena.conf
import: conf/import/login_conf.txt
