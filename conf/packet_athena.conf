// Athena 网络套接字配置文件
// 翻译：davidsiaw


// 显示调试报告(调试用，当发生错误时，报告会被储存。)
debug: no

// Linux/Epoll：每个周期最大事件数
// 默认值：
//	（最大支持连接数）/2
// 注意：控制每个周期（epoll_wait() 调用）收集的最大套接字事件数
//       例如设为 32，则每个服务器周期最多处理 32 个事件（收到的数据/新连接）
//       每个服务器周期。
// 注意：建议至少设置为最大支持连接数的一半
//       设得太小可能导致卡顿/延迟，
//       具体取决于可用的 CPU 时间。
// 注意：仅在 Linux 下以 EPoll 作为事件分发器编译时可用！
//
//epoll_maxevents: 1024

// 当连接非正常插断超过多少秒时关闭该连接？
stall_time: 60

//----- IP 规则设置 -----

// 连线时是否检查其IP？
// 也是一DDos的防御机制
enable_ip_rules: yes

// 检查顺序
//   deny,allow     ：先检查拒绝规则，再检查允许规则。没有规则匹配时允许。
//   allow,deny     ：先检查允许规则，再检查拒绝规则。没有规则匹配时允许。
//   mutual-failure ：只有允许规则匹配且没有拒绝规则匹配时才允许。
// （默认是 deny,allow）

order: deny,allow
// order: allow,deny
// order: mutual-failure

// IP 规则
//   allow ：接受该 IP 段的连接（即使被标记为 DDoS）
//   deny  ：拒绝该 IP 段的连接
// 规则按顺序处理，允许/拒绝列表中各自第一条匹配的规则生效

// allow: 127.0.0.1
// allow: 192.168.0.0/16
// allow: 10.0.0.0/255.0.0.0
// allow: all

// deny: 127.0.0.1


//---- DDoS 防护设置 ----
// 如果在 ddos_interval 毫秒内收到 ddos_count 次连接请求，则判定为 DDoS 攻击

// 连接间隔时间(毫秒)
// (默认是 3000 毫秒, 即为 3 秒)
ddos_interval: 3000

// 连接频率
// (默认是 5 次)
ddos_count: 5

// 遭受ddos攻击之后多久时间解除ddos限制 (毫秒)
// 此时间区间过后, DDoS 将不被视为
// (默认是 600000 毫秒, 即为 10 秒)
ddos_autoreset: 600000


import: conf/import/packet_conf.txt
